<!DOCTYPE html>
<html lang="de">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kodchasan:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Business Scorecard (Beta) — Praxis NeueWege</title>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<style>
:root {
  --bg:#f7f6f2; --surface:#ffffff; --border:#e2dfd8; --border-strong:#c8c4bc;
  --text:#1a1916; --text-muted:#6b6860; --text-hint:#a09e99;
  --accent:#7b3f1e; --accent-light:#f5ede7; --accent-mid:#c47848;
  --ok:#2e7d32; --ok-bg:#eef7ee; --warn:#b45309; --warn-bg:#fef7ec;
  --error:#9b1c1c; --error-bg:#fef2f2;
  --blue:#1565c0; --blue-bg:#eef4fb;
  --radius:8px; --radius-lg:12px; --hdr-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:100dvh}
body{font-family:'Kodchasan','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:var(--hdr-h);position:sticky;top:0;z-index:100}
.header-brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.header-brand img{height:28px;width:auto}
.header-brand span{font-size:13px;font-weight:600;color:var(--text)}
.header-right{display:flex;align-items:center;gap:8px}
.user-badge{display:none;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.user-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-mid);flex-shrink:0}
.version-badge{font-size:10px;font-weight:600;color:var(--text-hint);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px;margin-left:4px;font-family:'Kodchasan',monospace}
.beta-badge{font-size:10px;font-weight:700;color:#fff;background:var(--accent-mid);border-radius:4px;padding:1px 7px;letter-spacing:.4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;border:none;font-family:inherit;min-height:36px}
.btn-outline{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.btn-outline:hover{background:var(--accent-light)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text-muted);font-size:11px;padding:3px 10px;min-height:28px;border-radius:4px}
.btn-ghost:hover{border-color:var(--accent-mid);color:var(--accent)}
.btn-text{background:none;border:none;color:var(--text-muted);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;margin-top:12px}

/* ── LOGIN ── */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:calc(100dvh - var(--hdr-h));padding:24px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem 1.75rem;max-width:380px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login-title{font-size:18px;font-weight:600;margin-bottom:6px}
.login-desc{font-size:13px;color:var(--text-muted);margin-bottom:1.5rem;line-height:1.6}
.alert{border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-top:1rem}
.alert-error{background:var(--error-bg);color:var(--error);border:1px solid #fecaca}

/* ── APP ── */
#appScreen{display:none;flex-direction:column;min-height:calc(100dvh - var(--hdr-h))}
.demo-bar{display:none;align-items:center;gap:8px;background:var(--warn-bg);border-bottom:1px solid #f3dcb8;color:var(--warn);font-size:12px;padding:7px 20px;flex-wrap:wrap}
.demo-bar strong{font-weight:700}
.viewbar{padding:10px 20px;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.viewbar label{font-size:11px;color:var(--text-hint);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.pill-group{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:4px 13px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--text-muted);transition:all .12s}
.pill:hover{border-color:var(--accent-mid);color:var(--accent)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.select{height:32px;border:1px solid var(--border);border-radius:var(--radius);padding:0 10px;font-size:12px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;max-width:240px}
.select:focus{border-color:var(--accent-mid)}

/* ── GRID & CARDS ── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;padding:18px 20px 60px;max-width:1240px;margin:0 auto;width:100%}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:var(--border-strong)}
.card.c-score::before{background:var(--accent)}
.card.c-fin::before{background:var(--blue)}
.card.c-ausl::before{background:var(--ok)}
.card.c-pers::before{background:var(--warn)}
.card.c-fall::before{background:var(--accent-mid)}
.card.wide{grid-column:1 / -1}
.card h3{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.card .sub{font-size:11px;color:var(--text-hint);margin-bottom:12px}

/* Bereichs-Score-Kopf */
.score-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:10px}
.score-tile{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .12s}
.score-tile:hover{border-color:var(--accent-mid)}
.score-ring{width:52px;height:52px;flex-shrink:0}
.score-ring text{font-family:'Kodchasan',sans-serif;font-size:13px;font-weight:700}
.score-meta .t{font-size:12px;font-weight:600}
.score-meta .d{font-size:11px;color:var(--text-muted);line-height:1.4}

/* Kennzahlen */
.kpi-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi-big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.kpi-unit{font-size:13px;color:var(--text-muted);font-weight:500}
.delta{font-size:11px;font-weight:600;border-radius:4px;padding:1px 7px}
.delta.up{color:var(--ok);background:var(--ok-bg)}
.delta.down{color:var(--error);background:var(--error-bg)}
.delta.flat{color:var(--text-muted);background:var(--bg)}
.mini-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.mini-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-hint);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--border)}
.mini-table td{padding:5px 6px;border-bottom:1px solid var(--border)}
.mini-table tr:last-child td{border-bottom:none}
.mini-table td.num,.mini-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.mini-table tr.sum td{font-weight:700;border-top:2px solid var(--border-strong)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--error)} .dot.na{background:var(--border-strong)}
.tag{font-size:10px;font-weight:600;border-radius:4px;padding:1px 7px}
.tag.ok{color:var(--ok);background:var(--ok-bg)} .tag.warn{color:var(--warn);background:var(--warn-bg)} .tag.err{color:var(--error);background:var(--error-bg)}
.spark{display:block;margin-top:8px;width:100%;height:44px}
.legend{font-size:11px;color:var(--text-hint);margin-top:10px;line-height:1.6}
.hint-card{grid-column:1 / -1;background:var(--blue-bg);border:1px solid #cfe0f4;border-radius:var(--radius-lg);padding:14px 18px;font-size:12px;color:var(--text-muted);line-height:1.7}
.hint-card strong{color:var(--text)}
.skel{color:var(--text-hint);font-size:12px;padding:20px 0;text-align:center}
.section-label{grid-column:1 / -1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-hint);margin-top:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:520px){.grid{padding:14px 12px 50px}.kpi-big{font-size:22px}}
</style>
</head>
<body>

<header class="header">
  <div class="header-brand" onclick="location.href='app-central.html'">
    <img src="assets/logo.png" alt="Praxis NeueWege" onerror="this.style.display='none'">
    <span>Business Scorecard</span>
    <span class="beta-badge">BETA</span>
    <span class="version-badge" id="versionBadge"></span>
  </div>
  <div class="header-right">
    <div class="user-badge" id="userBadge"><span class="user-dot"></span><span id="userName"></span></div>
    <button class="btn btn-ghost" id="logoutBtn" style="display:none" onclick="doLogout()">Abmelden</button>
  </div>
</header>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-title">Business Scorecard</div>
    <div class="login-desc">Kennzahlen zu Finanzen, Auslastung, Personal und Fallentwicklung — exklusiv für die Geschäftsführung.</div>
    <button class="btn btn-outline" onclick="doLogin()" style="width:100%">Mit Microsoft anmelden</button>
    <button class="btn-text" onclick="startDemo()">Demo-Modus ohne Anmeldung öffnen</button>
    <div class="alert alert-error" id="loginError" style="display:none"></div>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <div class="demo-bar" id="demoBar">
    <strong>Demo-Modus</strong><span>— fiktive Zahlen. Struktur entspricht 1:1 dem geplanten Worker-Response von <code>GET /api/scorecard</code>.</span>
  </div>
  <div class="viewbar">
    <label>Sicht</label>
    <div class="pill-group" id="rolePills"></div>
    <label for="teamSelect">Team</label>
    <select class="select" id="teamSelect" onchange="renderAll()"></select>
    <label for="monatSelect">Monat</label>

  </div>
  <div class="grid" id="grid"><div class="skel">Lade Kennzahlen …</div></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
 * KONFIGURATION — identisch zur Organisation-App / Cockpit
 * Hinweis: redirectUri dieser Seite muss in Entra ID
 * (App-Registrierung → Authentifizierung) nachgetragen werden!
 * ═══════════════════════════════════════════════════════════ */
const CFG = {
  clientId: 'f7e00950-2421-43b5-b48a-447bf8e7d4b3',
  tenantId: '1ac059d9-8d39-43ab-a8db-bd9197bde0f4',
  redirectUri: 'https://apps.praxisneuewege.de/business-scorecard-beta.html',
  workerUrl: 'https://pnw-kilanka-proxy.markus-3c8.workers.dev'
};
const SCOPES = ['User.Read', 'User.ReadBasic.All', 'Sites.ReadWrite.All']; // Graph: Team-Hierarchie + BWA-Liste (SharePoint)
const APP_VERSION = 'BETA-dca30b9'; // auto-updated on deploy

/* ═══════════════════════════════════════════════════════════
 * KENNZAHLEN-DEFINITION & AMPELN (s. docs/scorecard-kennzahlen.md)
 *  – Auslastung: Fälle/VZÄ, Ziel 7,5 (LuV TL §5) · gelb < 6,8 · rot < 6,0
 *  – FLS-Quote Ø: Ziel ≥ 64 % · gelb < 58 % · rot < 50 % (Cockpit-Logik)
 *  – Krankheitsquote: AU-Tage ÷ verfügbare Arbeitstage ·
 *    VORSCHLAG: grün < 5 % · gelb 5–8 % · rot > 8 % (Sozialwirtschafts-üblich)
 *  – Forderungen: Anteil überfällig · grün < 10 % · gelb 10–25 % · rot > 25 %
 *  – Netto-Akquise: Ziel +2 Fälle/Team/Quartal (LuV TL §5)
 * ═══════════════════════════════════════════════════════════ */
const ZIEL = { auslastung: 7.5, fls: 64, krankWarn: 5, krankRot: 8, overdueWarn: 10, overdueRot: 25, akquise: 2,
               pkWarn: 60, pkRot: 70,  // PK-Quote (Personal ÷ Umsatz): kalibriert auf Ist H1/2026 ≈ 50 % — VORSCHLAG
               margeGruen: 25, margeGelb: 15 }; // Betriebsergebnis-Marge: Ist H1/2026 ≈ 36 % (Mai-Tief 16,8 %) — VORSCHLAG
const SP_HOST = 'praxisneuewegesonjapeltz978.sharepoint.com';
const BWA_LISTE = 'PNW-BWA';
let bwaDaten = {};        // Monat (JJJJ-MM) → { spId, Umsatzerloese, Personalkosten, Gesamtkosten, Betriebsergebnis, Kommentar }
let bwaStatus = null;     // null=nicht geladen · 'ok' · Fehlertext
let bwaSusa = null;       // aus SuSa-PDF: { monat, Liquiditaet, ForderungenDatev }
let zahlungsTreffer = null; // Ergebnis des Bank-CSV-Abgleichs (nur im Browser, keine Speicherung)
let bankTxs = null;       // zuletzt geparste Gutschriften (nur im Browser)
let bankDiag = null;
let graphToken = null;    // Access-Token aus liveTokens()

/* ═══════════════════════════════════════════════════════════
 * WORKER-KONTRAKT (Zielbild) — GET /api/scorecard?monat=YYYY-MM
 * Berechtigung serverseitig: Entra-Gruppen → GF = alles,
 * TL = nur eigenes Team (Worker filtert, Frontend zeigt nur an).
 * Response-Struktur = DEMO-Konstante unten. Quellen je Block:
 *  finanzen   ← /accounting/invoices (date/deliveryFrom, totalWithTax,
 *               paid, balance, isOverdue, dunningLevel, client, orgUnit)
 *  auslastung ← /clients (actions.attendants HB, department) +
 *               /users (targetHours → VZÄ) + Cockpit-flsAuswertung
 *  personal   ← /users/absences (AU-Tage, Typen) + berechneArbeitstage
 *  faelle     ← /clients Stichtagsvergleich Quartalsanfang/-ende
 *               (perspektivisch $cursor/$filter statt Vollabzug)
 * ═══════════════════════════════════════════════════════════ */

let msalInstance, currentAccount, accessToken;
let demoMode = false;
let viewerRole = 'gf';      // tl | gf
let scData = null;          // Daten des aktuell gewählten Monats
let monatCache = {};        // Live-Modus: geladene Monate

/* ── DEMO-DATEN — fiktive Teams, realistische Struktur ── */
const DEMO_MONATE = ['2026-02','2026-03','2026-04','2026-05','2026-06','2026-07'];
const DEMO = {
  '2026-07': {
    monat: '2026-07', stand: '2026-07-20',
    finanzen: {
      umsatzMonat: 248900, umsatzVormonat: 236400,
      umsatzVerlauf: [221000, 228500, 231200, 239800, 236400, 248900],
      forderungen: { offenGesamt: 412600, ueberfaellig: 61300, mahnstufe1: 3, mahnstufe2plus: 1 },
      topSchuldner: [
        { amt: 'JA Beispielstadt', offen: 98400, ueberfaellig: 31200, aeltesteTage: 74 },
        { amt: 'JA Musterkreis',   offen: 64100, ueberfaellig: 18900, aeltesteTage: 51 },
        { amt: 'JA Probehausen',   offen: 47800, ueberfaellig: 11200, aeltesteTage: 38 }
      ],
      umsatzNachAmt: [
        { amt: 'JA Beispielstadt', betrag: 71200 }, { amt: 'JA Musterkreis', betrag: 58400 },
        { amt: 'JA Probehausen', betrag: 44300 }, { amt: 'Weitere (7 Ämter)', betrag: 75000 }
      ]
    },
    teams: [
      { name: 'Team Beispiel-Nord', tl: 'Muster, Jonas', vzae: 6.2, faelle: 49, flsQuote: 66.1, flsVormonat: 63.4,
        krankQuoteMonat: 3.8, krankQuoteYtd: 4.6, akquiseQuartal: { zugaenge: 5, abgaenge: 2 },
        mitarbeiter: [
          { name: 'Beispiel, Mia', vzae: 0.82, faelle: 7, flsQuote: 68.2, krankTageMonat: 0 },
          { name: 'Muster, Jonas', vzae: 1.0, faelle: 8, flsQuote: 64.9, krankTageMonat: 1 },
          { name: 'Probe, Sara',  vzae: 0.51, faelle: 4, flsQuote: 61.0, krankTageMonat: 2 }
        ] },
      { name: 'Team Beispiel-Süd', tl: 'Beispiel, Lena', vzae: 7.8, faelle: 51, flsQuote: 60.8, flsVormonat: 61.9,
        krankQuoteMonat: 6.4, krankQuoteYtd: 5.9, akquiseQuartal: { zugaenge: 3, abgaenge: 3 },
        mitarbeiter: [
          { name: 'Beispiel, Lena', vzae: 1.0, faelle: 7, flsQuote: 63.1, krankTageMonat: 0 },
          { name: 'Test, Amir',     vzae: 0.9, faelle: 6, flsQuote: 57.4, krankTageMonat: 3 }
        ] },
      { name: 'Team Beispiel-West', tl: 'Probe, Nadja', vzae: 5.4, faelle: 36, flsQuote: 63.2, flsVormonat: 60.5,
        krankQuoteMonat: 9.1, krankQuoteYtd: 7.2, akquiseQuartal: { zugaenge: 1, abgaenge: 3 },
        mitarbeiter: [
          { name: 'Probe, Nadja', vzae: 1.0, faelle: 7, flsQuote: 65.0, krankTageMonat: 0 },
          { name: 'Demo, Kilian', vzae: 0.77, faelle: 5, flsQuote: 59.8, krankTageMonat: 6 }
        ] }
    ],
    fallbestandVerlauf: [128, 131, 133, 134, 135, 136],
    hinweise: ['FLS-Ist weiterhin aus Rechnungen des Vormonats (Leistungsdoku-Graph noch nicht freigegeben).']
  }
};
// übrige Demo-Monate: leicht variierte Kopie
DEMO_MONATE.slice(0,5).forEach((m,i) => {
  const d = JSON.parse(JSON.stringify(DEMO['2026-07']));
  d.monat = m; d.stand = m + '-28';
  d.finanzen.umsatzMonat = d.finanzen.umsatzVerlauf[i];
  d.finanzen.umsatzVormonat = i>0 ? d.finanzen.umsatzVerlauf[i-1] : 214000;
  d.finanzen.umsatzVerlauf = d.finanzen.umsatzVerlauf.slice(0, i+1);
  d.fallbestandVerlauf = d.fallbestandVerlauf.slice(0, i+1);
  d.teams.forEach(t => { t.flsQuote = +(t.flsQuote - (5-i)*0.6).toFixed(1); });
  DEMO[m] = d;
});

/* ═══ HELPERS ═══ */
const eur = v => v.toLocaleString('de-DE', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const pct = v => v.toLocaleString('de-DE', { maximumFractionDigits:1 }) + ' %';
const monatLabel = m => { const [y,mo]=m.split('-'); return ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][+mo-1]+' '+y; };
function ampel(wert, gruenAb, gelbAb, invers=false){ // invers: kleiner = besser
  if (wert == null) return 'na';
  if (!invers) return wert >= gruenAb ? 'ok' : (wert >= gelbAb ? 'warn' : 'err');
  return wert < gruenAb ? 'ok' : (wert < gelbAb ? 'warn' : 'err');
}
const ampelPunkte = a => a==='ok'?100 : a==='warn'?60 : a==='err'?20 : null;
function spark(vals, color){
  if (!vals || vals.length < 2) return '';
  const w=260, h=44, min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const pts = vals.map((v,i)=>[(i/(vals.length-1))*(w-8)+4, h-6-((v-min)/span)*(h-14)]);
  const line = pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const last = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${color}"/></svg>`;
}
function ring(punkte, farbeVar){
  const r=22, c=2*Math.PI*r, off = punkte==null ? c : c*(1-punkte/100);
  return `<svg class="score-ring" viewBox="0 0 52 52" role="img" aria-label="Score ${punkte??'—'} von 100">
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--border)" stroke-width="5"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(${farbeVar})" stroke-width="5"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round"
      transform="rotate(-90 26 26)"/>
    <text x="26" y="31" text-anchor="middle" fill="var(--text)">${punkte==null?'—':punkte}</text></svg>`;
}

/* ═══ SICHT / FILTER ═══ */
function sichtbareTeams(){
  const sel = document.getElementById('teamSelect').value;
  if (viewerRole === 'tl') return scData.teams; // Worker liefert nur das eigene Team
  return sel === '*' ? scData.teams : scData.teams.filter(t => t.name === sel);
}
const zeile1 = s => String(s || '').split('\n')[0];
const fmtQ = v => v == null ? '—' : pct(v);
const jvj = (cur, prev) => prev ? ` (${((cur-prev)/prev*100)>=0?'+':''}${((cur-prev)/prev*100).toLocaleString('de-DE',{maximumFractionDigits:1})} %)` : '';
const warnMark = ' <span title="FLS-Soll vermutlich unvollständig (Kontingent ohne Bewertung/timeBase)" style="cursor:help">⚠</span>';

/* ═══ RENDER ═══ */
function renderAll(){
  if (!scData) return;

function scoreTile(t, ringHtml, desc){
  return `<div class="score-tile">${ringHtml}<div class="score-meta"><div class="t">${t}</div><div class="d">${desc}</div></div></div>`;

function delta(cur, prev){
  if (prev == null || prev === 0) return '';
  const d = (cur-prev)/prev*100, cls = d > 0.5 ? 'up' : (d < -0.5 ? 'down' : 'flat');
  return `<span class="delta ${cls}">${d>=0?'+':''}${d.toLocaleString('de-DE',{maximumFractionDigits:1})} % vs. Vormonat</span>`;
}

function margenCard(monat){
  const monate = Object.keys(bwaDaten).sort();
  const kopf = `<h3>Margen</h3><div class="sub">Betriebsergebnis ÷ Umsatzerlöse (BWA, vorläufige Buchführung)</div>`;
  if (!monate.length) return `<div class="card c-fin">${kopf}<div class="legend">Noch keine BWA-Monate erfasst — die Margen erscheinen automatisch nach dem KER-PDF-Import.</div></div>`;
  const marge = m => { const b = bwaDaten[m]; return b && b.Umsatzerloese ? b.Betriebsergebnis / b.Umsatzerloese * 100 : null; };
  const akt = marge(monat);
  const sumU = monate.reduce((s, m) => s + (bwaDaten[m].Umsatzerloese || 0), 0);
  const sumE = monate.reduce((s, m) => s + (bwaDaten[m].Betriebsergebnis || 0), 0);
  const kum = sumU ? sumE / sumU * 100 : null;
  const aAkt = ampel(akt, ZIEL.margeGruen, ZIEL.margeGelb);
  const letzte = monate.slice(-6);
  const verlauf = letzte.map(marge).filter(v => v != null);
  return `
  <div class="card c-fin">
    ${kopf}
    <div class="kpi-row"><span class="kpi-big">${akt != null ? pct(akt) : '—'}</span>
      <span class="kpi-unit">im ${monatLabel(monat)}</span>
      ${kum != null ? `<span class="tag ${ampel(kum, ZIEL.margeGruen, ZIEL.margeGelb)}">${pct(kum)} kumuliert (${monatLabel(monate[0])}–${monatLabel(monate[monate.length-1])})</span>` : ''}</div>
    ${(() => {
      const jahr = monat.slice(0, 4), mEnd = monat.slice(5, 7);
      const imJahr = jj => monate.filter(x => x.slice(0, 4) === jj && x.slice(5, 7) <= mEnd);
      const agg = ms => {
        const u = ms.reduce((s, x) => s + (bwaDaten[x].Umsatzerloese || 0), 0);
        const e = ms.reduce((s, x) => s + (bwaDaten[x].Betriebsergebnis || 0), 0);
        return { u, e, m: u ? e / u * 100 : null, n: ms.length };
      };
      const h = agg(imJahr(jahr)), v = agg(imJahr(String(+jahr - 1)));
      if (!v.n) return `<div class="legend">Vorjahresvergleich: 2025er KER-PDFs importieren — YoY und Vorjahres-YTD erscheinen dann automatisch.</div>`;
      return `<div class="legend">YTD ${jahr} (${h.n} Mon.): Ergebnis <b>${eur(h.e)}</b>, Marge ${fmtQ(h.m)} · Vorjahres-YTD (${v.n} Mon.): ${eur(v.e)}, Marge ${fmtQ(v.m)}${h.m != null && v.m != null ? ` <b>(${(h.m - v.m) >= 0 ? '+' : ''}${(h.m - v.m).toLocaleString('de-DE', { maximumFractionDigits: 1 })} pp)</b>` : ''}</div>`;
    })()}
    ${verlauf.length >= 2 ? spark(verlauf, 'var(--blue)') : ''}
    <table class="mini-table"><thead><tr><th>Monat</th><th class="num">Umsatz</th><th class="num">Ergebnis</th><th class="num">Marge</th></tr></thead><tbody>
      ${letzte.map(m => { const b = bwaDaten[m], mg = marge(m);
        return `<tr><td>${monatLabel(m)}</td><td class="num">${eur(b.Umsatzerloese || 0)}</td><td class="num">${eur(b.Betriebsergebnis || 0)}</td><td class="num"><span class="dot ${ampel(mg, ZIEL.margeGruen, ZIEL.margeGelb)}"></span>${mg != null ? pct(mg) : '—'}</td></tr>`; }).join('')}
    </tbody></table>
    <div class="legend">Schwellen (Vorschlag, Ist H1 ≈ 36 %): grün ≥ ${ZIEL.margeGruen} % · gelb ${ZIEL.margeGelb}–${ZIEL.margeGruen} % · rot &lt; ${ZIEL.margeGelb} %. Achtung: aktuell ohne Unternehmerlohn (Einzelunternehmen, Entnahmen in Kl. 2) — nach der GmbH-Umwandlung mindern die GF-Gehälter die Marge strukturell.</div>
  </div>`;
}

/* ═══ ZAHLUNGSABGLEICH (Bank-CSV vs. offene Kilanka-Rechnungen) ═══
   Kontodaten bleiben vollständig im Browser — kein Upload, keine Ablage. */
function spalten(z, d){
  const out = []; let cur = '', q = false;
  for (const ch of z){
    if (ch === '"') q = !q;
    else if (ch === d && !q) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function parseBankCsv(text){
  const zeilen = String(text).replace(/^\uFEFF/, '').split(/\r?\n/).filter(z => z.trim());
  let hi = 0, best = -1;
  for (let i = 0; i < Math.min(zeilen.length, 40); i++){
    const z = zeilen[i].toLowerCase();
    const trenner = Math.max((z.match(/;/g)||[]).length, (z.match(/,/g)||[]).length);
    let score = trenner;
    if (/betrag|umsatz|amount/.test(z)) score += 20;
    if (/verwendungszweck|buchungstext|zweck|vorgang/.test(z)) score += 20;
    if (score > best) { best = score; hi = i; }
  }
  const delim = (zeilen[hi].match(/;/g) || []).length >= (zeilen[hi].match(/,/g) || []).length ? ';' : ',';
  const kopf = spalten(zeilen[hi], delim).map(s => s.toLowerCase().replace(/^\uFEFF/, ''));
  const idx = re => kopf.findIndex(k => re.test(k));
  // Betragsspalte PRIORISIERT suchen — "Umsatzart" (Commerzbank) darf nicht
  // fälschlich als Betragsspalte greifen
  let iBetrag = idx(/^betrag\b|(^|\s)betrag($|\s|\()/);
  if (iBetrag < 0) iBetrag = idx(/umsatz(?!art|steuer)/);
  if (iBetrag < 0) iBetrag = idx(/amount/);
  const iSH = idx(/soll.?haben|^s\/h$|^h\/s$/);
  const iDatum = idx(/buchung|valuta|datum|date/);
  const istGeldbetrag = s => /^-?\d{1,3}(\.\d{3})*(,\d{1,2})?$|^-?\d+([.,]\d{1,2})?$/.test(String(s).trim());
  const txs = [];
  for (let i = hi + 1; i < zeilen.length; i++){
    const c = spalten(zeilen[i], delim);
    if (c.length < 2) continue;
    let betrag = iBetrag >= 0 && istGeldbetrag(c[iBetrag]) ? deNum(c[iBetrag]) : null;
    if (betrag == null){
      // Fallback: letzter Wert der Zeile, der wie ein Geldbetrag aussieht
      for (let k = c.length - 1; k >= 0; k--){
        if (istGeldbetrag(c[k])) { betrag = deNum(c[k]); break; }
      }
    }
    if (betrag == null) continue;
    if (iSH >= 0 && /^s$/i.test(c[iSH] || '')) betrag = -Math.abs(betrag);
    if (betrag <= 0) continue; // nur Gutschriften
    const vwz = c.filter((_, k) => k !== iBetrag).join(' ');
    txs.push({ betrag, vwz, datum: iDatum >= 0 ? (c[iDatum] || '') : '' });
  }
  return { txs, diag: { kopfzeile: hi + 1, delim, betragSpalte: iBetrag >= 0 ? kopf[iBetrag] : 'letzter Geldbetrag je Zeile' } };
}
function parseDatumDE(s){
  const m = /(\d{2})\.(\d{2})\.(\d{4})/.exec(String(s || ''));
  return m ? new Date(Date.UTC(+m[3], +m[2] - 1, +m[1])) : null;
}
const EMPF_STOPWORTE = new Set(['landratsamt','landkreis','kreisjugendamt','jugendamt','stadtkasse','kreiskasse','abteilung','familie','jugend','bildung','stadt','kasse','sozialamt','verwaltung']);
function empfaengerTokens(e){
  return String(e || '').toLowerCase().split(/[^a-zäöüß]+/)
    .filter(w => w.length >= 5 && !EMPF_STOPWORTE.has(w))
    .map(w => w.replace(/[^a-z]/g, ''));
}
// Explizite Rechnungsnummern-Referenzen aus einem Buchungstext ziehen
// (RE-NR. 2026-06-00698 · Re-Nr.: 00652 · RE2026-06-00618 · RENR. …)
function rechnungsRefs(vwz){
  const refs = [];
  const re = /re\s*[-.]?\s*(?:nr\.?)?\s*:?\s*((?:20\d{2}\s*[-.]?\s*\d{2}\s*[-.]?\s*)?\d{3,6})/gi;
  let m; const roh = String(vwz || '');
  while ((m = re.exec(roh))) refs.push(m[1].replace(/[^0-9]/g, ''));
  return refs;
}
function refPasstZuRechnung(refs, nrZiffern, varianten){
  if (!refs.length) return true; // keine Referenz im Text → Betragsvergleich zulässig
  return refs.some(x => {
    const xKurz = x.replace(/^0+/, '');
    return nrZiffern.includes(x) || x.includes(nrZiffern) || (varianten || []).includes(xKurz);
  });
}
function matcheZahlungen(rechnungen, txs){
  const norm = s => String(s || '').toLowerCase().replace(/[^0-9a-z]/g, '');
  const treffer = [];
  const offenNachNummer = [];
  const perNummerBelegt = new Set(); // Gutschriften mit Nummern-Zuordnung: für Betragsvergleich gesperrt
  // Kurznummern (Fortlaufnummer) sind nur INNERHALB eines Jahres eindeutig —
  // Format RE<Jahr>-<Monat>-<Fortlaufnummer>, Zählung beginnt am Jahresanfang.
  // Kommt dieselbe Kurznummer bei mehreren offenen Rechnungen vor
  // (Jahreswechsel), bindet die Kurzform nur zusammen mit Betragsbeweis.
  // Fortlaufnummer ist 5-stellig; Ämter kürzen teils auf die LETZTEN 4 Ziffern
  // (echtes Abschneiden, nicht nur führende Nullen: 12345 → "2345").
  const kurzVarianten = (nummer) => {
    const bloecke = String(nummer || '').split(/[^0-9]+/).filter(Boolean);
    if (!bloecke.length) return [];
    const block = bloecke[bloecke.length - 1];
    const v = new Set();
    const v1 = block.replace(/^0+/, '');
    if (v1.length >= 3) v.add(v1);
    if (block.length >= 5){
      const v2 = block.slice(-4).replace(/^0+/, '');
      if (v2.length >= 3) v.add(v2);
    }
    return [...v];
  };
  const kurzZaehler = new Map();
  for (const r of rechnungen || []){
    for (const k of kurzVarianten(r.nummer)) kurzZaehler.set(k, (kurzZaehler.get(k) || 0) + 1);
  }
  // ── Stufe 1: Nummern-Matching (Sammelüberweisungen dürfen mehrere
  //    Rechnungen über EINE Gutschrift abdecken) ──
  for (const r of rechnungen || []){
    const nr = norm(r.nummer);
    const nrZiffern = nr.replace(/[a-z]/g, '');
    const varianten = kurzVarianten(r.nummer);
    const kurzRe = varianten.length
      ? new RegExp('(?:renr|rgnr|rechnr|rechnungnr|rechnungsnr|re|rg|nr)(?:' + varianten.map(v => '0*' + v).join('|') + ')(?![0-9])')
      : null;
    const kurzMehrdeutig = varianten.some(v => (kurzZaehler.get(v) || 0) > 1);
    let ti = -1, art = null;
    if (nr.length >= 4) ti = txs.findIndex(t => norm(t.vwz).includes(nr));
    if (ti < 0 && nrZiffern.length >= 6) ti = txs.findIndex(t => norm(t.vwz).includes(nrZiffern));
    if (ti >= 0) art = 'Rechnungsnr.';
    if (ti < 0 && kurzRe){
      // Alle Kandidaten mit passender Kurznummer; Betragsbeweis bevorzugt
      const kandidaten = [];
      txs.forEach((t, i) => { if (kurzRe.test(norm(t.vwz))) kandidaten.push(i); });
      const mitBetrag = kandidaten.find(i =>
        Math.abs(txs[i].betrag - r.betrag) < 0.01 || Math.abs(txs[i].betrag - r.brutto) < 0.01);
      if (mitBetrag != null) { ti = mitBetrag; art = 'Rechnungsnr.'; }
      else if (kandidaten.length && !kurzMehrdeutig) { ti = kandidaten[0]; art = 'Kurz-Nr. (prüfen!)'; }
      // mehrdeutige Kurznummer ohne Betragsbeweis: kein Treffer (Jahreswechsel-Schutz)
    }
    if (ti >= 0){
      perNummerBelegt.add(ti);
      treffer.push({ ...r, art, zahlDatum: txs[ti].datum, zahlBetrag: txs[ti].betrag });
    } else offenNachNummer.push(r);
  }
  // ── Stufe 2: Betrags-Matching, streng plausibilisiert ──
  //    (a) Buchungsdatum ≥ Rechnungsdatum
  //    (b) jede Gutschrift begleicht höchstens EINE Rechnung; per Nummer
  //        zugeordnete Gutschriften sind komplett gesperrt
  //    (c) Absender/Verwendungszweck muss zum Rechnungsempfänger passen
  //    (d) nennt die Gutschrift eine ANDERE Rechnungsnummer, ist sie tabu
  const benutzt = new Set(perNummerBelegt);
  for (const r of offenNachNummer){
    const rDatum = r.datum ? new Date(r.datum) : null;
    const tokens = empfaengerTokens(r.empfaenger);
    const nrZiffern = norm(r.nummer).replace(/[a-z]/g, '');
    const varianten = kurzVarianten(r.nummer);
    let gefunden = -1;
    for (let i = 0; i < txs.length; i++){
      if (benutzt.has(i)) continue;
      const t = txs[i];
      if (Math.abs(t.betrag - r.betrag) >= 0.01 && Math.abs(t.betrag - r.brutto) >= 0.01) continue;
      const tDatum = parseDatumDE(t.datum);
      if (!rDatum || !tDatum || tDatum < rDatum) continue;
      if (tokens.length && !tokens.some(tok => norm(t.vwz).includes(tok))) continue;
      if (!refPasstZuRechnung(rechnungsRefs(t.vwz), nrZiffern, varianten)) continue;
      gefunden = i;
      break;
    }
    if (gefunden >= 0){
      benutzt.add(gefunden);
      treffer.push({ ...r, art: 'Betrag (prüfen!)', zahlDatum: txs[gefunden].datum, zahlBetrag: txs[gefunden].betrag });
    }
  }
  treffer.sort((a, b) => (a.art === b.art ? 0 : a.art === 'Rechnungsnr.' ? -1 : b.art === 'Rechnungsnr.' ? 1 : 0)
    || String(a.nummer).localeCompare(String(b.nummer)));
  return { treffer, txAnzahl: txs.length };
}
function bankCsvGewaehlt(ev){
  const file = ev.target.files && ev.target.files[0];
  if (!file || !scData || !scData.finanzen) return;
  const reader = new FileReader();
  reader.onload = () => {
    // Encoding erkennen: erst UTF-8; bei Ersatzzeichen als windows-1252 (ANSI)
    const bytes = new Uint8Array(reader.result);
    let text = new TextDecoder('utf-8').decode(bytes);
    if (text.includes('\uFFFD')) text = new TextDecoder('windows-1252').decode(bytes);
    const p = parseBankCsv(text);
    bankTxs = p.txs; bankDiag = p.diag;
    zahlungsTreffer = matcheZahlungen(scData.finanzen.offeneRechnungen, p.txs);
    zahlungsTreffer.diag = p.diag;
    renderAll();
  };
  reader.readAsArrayBuffer(file);
}

const deNum = s => { const n = parseFloat(String(s).replace(/\./g,'').replace(',','.')); return Number.isFinite(n) ? n : null; };
// Number-Inputs liefern Punkt-Dezimal ("133893.29") — deNum würde den Punkt
// als Tausendertrenner entfernen (Faktor-100-Fehler). Deshalb: nur bei Komma
// deutsch parsen, sonst Standard-parseFloat.
const zahlAusFeld = v => {
  const s = String(v ?? '').trim();
  if (!s) return null;
  if (s.includes(',')) return deNum(s);
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : null;
};

// ── DATEV-PDF-Import (Kurzfristige Erfolgsrechnung + Summen und Salden) ──
const MONATE_DE = { januar:'01', februar:'02', 'märz':'03', april:'04', mai:'05', juni:'06', juli:'07', august:'08', september:'09', oktober:'10', november:'11', dezember:'12' };
let pdfJsGeladen = null;
function ladePdfJs(){
  if (pdfJsGeladen) return pdfJsGeladen;
  pdfJsGeladen = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      res(window.pdfjsLib);
    };
    s.onerror = () => rej(new Error('pdf.js konnte nicht geladen werden'));
    document.head.appendChild(s);
  });
  return pdfJsGeladen;
}
// pdf.js liefert Text in Stream-Reihenfolge — Zeilen aus den Y-Koordinaten
// visuell rekonstruieren (sonst verrutschen die DATEV-Spalten)
async function pdfZeilen(file){
  const lib = await ladePdfJs();
  const buf = await file.arrayBuffer();
  const doc = await lib.getDocument({ data: buf }).promise;
  const zeilen = [];
  for (let p = 1; p <= doc.numPages; p++){
    const seite = await doc.getPage(p);
    const inhalt = await seite.getTextContent();
    const items = inhalt.items
      .filter(i => i.str && i.str.trim())
      .map(i => ({ x: i.transform[4], y: i.transform[5], s: i.str }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    let akt = null, aktY = null;
    for (const it of items){
      if (aktY === null || Math.abs(it.y - aktY) > 3){
        if (akt) zeilen.push(akt.map(k => k.s).join(' '));
        akt = [it]; aktY = it.y;
      } else akt.push(it);
    }
    if (akt) zeilen.push(akt.map(k => k.s).join(' '));
  }
  return zeilen;
}
function monatAus(text){
  const m = /(Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)\s+(20\d{2})/i.exec(text);
  return m ? m[2] + '-' + MONATE_DE[m[1].toLowerCase()] : null;
}
function parseKerZeilen(zeilen){
  const erg = { monat: monatAus(zeilen.join(' ')) };
  const felder = { Umsatzerloese: /^Umsatzerlöse\b/, Personalkosten: /^Personalkosten\b/, Gesamtkosten: /^Gesamtkosten\b/, Betriebsergebnis: /^Betriebsergebnis\b/ };
  for (const [k, re] of Object.entries(felder)){
    const z = zeilen.find(x => re.test(x.trim()));
    const w = z && /(-?[\d.]+,\d{2})/.exec(z);
    if (w) erg[k] = deNum(w[1]);
  }
  return erg;
}
function susaSaldo(zeilen, kto){
  for (const z of zeilen){
    if (new RegExp('^\\s*' + kto + '\\s+\\D').test(z)){
      const paare = [...z.matchAll(/(-?[\d.]+,\d{2})\s+(S|H)\b/g)];
      if (paare.length){
        const [, b, sh] = paare[paare.length - 1];
        return deNum(b) * (sh === 'S' ? 1 : -1);
      }
      return 0; // Konto vorhanden, Saldo 0,00 ohne S/H-Kennzeichen
    }
  }
  return null;
}
function parseSusaZeilen(zeilen){
  const liqKonten = ['1600', '1800', '1810', '1820', '1830'];
  let liq = 0, gefunden = 0;
  for (const kto of liqKonten){
    const s = susaSaldo(zeilen, kto);
    if (s !== null){ liq += s; gefunden++; }
  }
  return {
    monat: monatAus(zeilen.join(' ')),
    Liquiditaet: gefunden ? Math.round(liq * 100) / 100 : null,
    ForderungenDatev: susaSaldo(zeilen, '1200'),
  };
}
async function bwaDateiGewaehlt(ev){
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const meld = document.getElementById('bwaMeldung');

  try {
    meld.textContent = 'Lese PDF …';
    const zeilen = await pdfZeilen(file);
    const text = zeilen.join(' ');
    if (/Kurzfristige Erfolgsrechnung/i.test(text)){
      const k = parseKerZeilen(zeilen);
      if (k.monat) document.getElementById('bwaMonat').value = k.monat;
      let n = 0;

      }

    } else if (/Summen und Salden/i.test(text)){
      bwaSusa = parseSusaZeilen(zeilen);

      meld.textContent = `SuSa ${bwaSusa.monat || ''}: Liquidität ${bwaSusa.Liquiditaet != null ? eur(bwaSusa.Liquiditaet) : '—'}, Forderungen (1200) ${bwaSusa.ForderungenDatev != null ? eur(bwaSusa.ForderungenDatev) : '—'} — wird beim Speichern mit abgelegt.`;
    } else {
      meld.textContent = 'PDF erkannt, aber weder KER noch SuSa — bitte manuell eintragen.';
    }
  } catch(e){ meld.textContent = 'PDF-Fehler: ' + e.message; }
}

// DATEV-BWA-CSV: Kennzahlenzeilen finden, letzten Zahlenwert übernehmen
function bwaCsvGewaehlt(ev){
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const zeilen = String(reader.result).split(/\r?\n/);
    const suche = [
      [/umsatzerl/i, 'bwaU'],
      [/personalkosten/i, 'bwaP'],
      [/gesamtkosten/i, 'bwaG'],
      [/betriebsergebnis/i, 'bwaE'],
    ];
    let treffer = 0;
    for (const [re, feld] of suche) {
      const zeile = zeilen.find(z => re.test(z));
      if (!zeile) continue;
      const werte = zeile.split(/[;\t]/).map(deNum).filter(v => v != null);
      if (werte.length) { document.getElementById(feld).value = werte[werte.length - 1]; treffer++; }
    }
    document.getElementById('bwaMeldung').textContent =
      treffer ? treffer + ' von 4 Kennzahlen aus der CSV übernommen — bitte prüfen.' : 'Keine Kennzahlenzeilen erkannt — bitte manuell eintragen.';
  };
  reader.readAsText(file, 'windows-1252'); // DATEV-Exporte sind meist ANSI-codiert
}

async function graphFetch(pfad, opts){
  const r = await fetch('https://graph.microsoft.com/v1.0' + pfad, {
    ...(opts || {}),
    headers: { Authorization: 'Bearer ' + graphToken, 'Content-Type': 'application/json', ...((opts||{}).headers||{}) },
  });
  if (!r.ok) { let d=''; try { d = (await r.json()).error?.message || ''; } catch(_){}; throw new Error('Graph HTTP ' + r.status + (d?' — '+d:'')); }
  return r.status === 204 ? null : r.json();
}

  const listen = await graphFetch(`/sites/${site.id}/lists?$filter=displayName eq '${BWA_LISTE}'`);
  if (!listen.value || !listen.value.length) throw new Error(`Liste "${BWA_LISTE}" nicht gefunden — bitte im SharePoint anlegen (s. Hinweiskarte).`);
  bwaListePfad = `/sites/${site.id}/lists/${listen.value[0].id}`;
  return bwaListePfad;
}
// Legt die Liste PNW-BWA samt Zahl-Spalten selbst an. Braucht Sites.Manage.All —
// wird per Popup einmalig zusätzlich angefragt (inkrementelle Zustimmung),
// der normale Betrieb bleibt bei Sites.ReadWrite.All.
async function erstelleBwaListe(){
  const meld = document.getElementById('bwaMeldung');
  try {
    meld.textContent = 'Lege Liste an — bitte Popup bestätigen …';
    const t = await msalInstance.acquireTokenPopup({ scopes: ['Sites.Manage.All'], account: currentAccount });
    const site = await fetch('https://graph.microsoft.com/v1.0/sites/' + SP_HOST + ':/', {
      headers: { Authorization: 'Bearer ' + t.accessToken } }).then(r => r.json());
    const r = await fetch(`https://graph.microsoft.com/v1.0/sites/${site.id}/lists`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + t.accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        displayName: BWA_LISTE,
        list: { template: 'genericList' },
        columns: [
          { name: 'Umsatzerloese', number: {} },
          { name: 'Personalkosten', number: {} },
          { name: 'Gesamtkosten', number: {} },
          { name: 'Betriebsergebnis', number: {} },
          { name: 'Liquiditaet', number: {} },
          { name: 'ForderungenDatev', number: {} },
          { name: 'Kommentar', text: {} },
        ],
      }),
    });
    if (!r.ok){ const d = await r.json().catch(() => ({})); throw new Error(d.error?.message || 'HTTP ' + r.status); }
    bwaListePfad = null; bwaStatus = null;
    await ladeBwa();
    meld.textContent = 'Liste angelegt — jetzt Speichern klicken.';
    renderAll();
  } catch(e){ meld.textContent = 'Liste anlegen fehlgeschlagen: ' + e.message; }
}
async function ladeBwa(){
  try {
    const basis = await bwaListe();
    const items = await graphFetch(basis + '/items?expand=fields&$top=200');
    bwaDaten = {};
    for (const it of items.value || []) {
      const fx = it.fields || {};
      if (!/^\d{4}-\d{2}$/.test(fx.Title || '')) continue;
      bwaDaten[fx.Title] = { spId: it.id, Umsatzerloese: fx.Umsatzerloese ?? null, Personalkosten: fx.Personalkosten ?? null,
        Gesamtkosten: fx.Gesamtkosten ?? null, Betriebsergebnis: fx.Betriebsergebnis ?? null,
        Liquiditaet: fx.Liquiditaet ?? null, ForderungenDatev: fx.ForderungenDatev ?? null, Kommentar: fx.Kommentar || null };
    }
    bwaStatus = 'ok';
  } catch(e){ bwaStatus = 'BWA-Daten nicht verfügbar: ' + e.message; }
}
async function speichereBwa(){
  const meld = document.getElementById('bwaMeldung');
  const monat = (document.getElementById('bwaMonat').value || '').trim();
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(monat)) { meld.textContent = 'Monat bitte als JJJJ-MM angeben.'; return; }
  const felder = {
    Title: monat,
    Umsatzerloese: zahlAusFeld(document.getElementById('bwaU').value),
    Personalkosten: zahlAusFeld(document.getElementById('bwaP').value),
    Gesamtkosten: zahlAusFeld(document.getElementById('bwaG').value),
    Betriebsergebnis: zahlAusFeld(document.getElementById('bwaE').value),
  };
  if (bwaSusa && bwaSusa.monat === monat){
    if (bwaSusa.Liquiditaet != null) felder.Liquiditaet = bwaSusa.Liquiditaet;
    if (bwaSusa.ForderungenDatev != null) felder.ForderungenDatev = bwaSusa.ForderungenDatev;
  }
  try {
    meld.textContent = 'Speichere …';
    const basis = await bwaListe();
    const vorhanden = bwaDaten[monat];
    const schreibe = async (f) => {
      if (vorhanden && vorhanden.spId) {
        await graphFetch(`${basis}/items/${vorhanden.spId}/fields`, { method: 'PATCH', body: JSON.stringify(f) });
      } else {
        await graphFetch(`${basis}/items`, { method: 'POST', body: JSON.stringify({ fields: f }) });
      }
    };
    try { await schreibe(felder); }
    catch(e){
      // Liste hat die SuSa-Spalten (noch) nicht → Kernwerte trotzdem sichern
      if (felder.Liquiditaet != null || felder.ForderungenDatev != null){
        const { Liquiditaet, ForderungenDatev, ...kern } = felder;
        await schreibe(kern);
        meld.textContent = 'Kernwerte gespeichert — Spalten "Liquiditaet"/"ForderungenDatev" fehlen in der Liste (Typ Zahl anlegen für die SuSa-Werte). ';
      } else throw e;
    }
    await ladeBwa();
    meld.textContent = 'Gespeichert.';
    renderAll();
  } catch(e){ meld.textContent = 'Fehler: ' + e.message; }
}

/* ═══ SICHT-STEUERUNG ═══ */
function monatOptionen(){
  if (demoMode) return DEMO_MONATE.slice().reverse();
  const heute = new Date(); const liste = [];
  for (let i = 0; i < 6; i++) {
    liste.push(new Date(Date.UTC(heute.getUTCFullYear(), heute.getUTCMonth() - i, 1)).toISOString().slice(0, 7));
  }
  return liste;
}
function initViewbar(){
  const wrap = document.getElementById('rolePills');
  if (demoMode) {
    const roles = [['gf','Geschäftsführung']]; // Zugriff ist GF-exklusiv (Vorgabe 21.07.2026)
    wrap.style.display = '';
    wrap.innerHTML = roles.map(([k,l]) =>
      `<button class="pill ${k===viewerRole?'active':''}" data-r="${k}">${l}</button>`).join('');
    wrap.querySelectorAll('.pill').forEach(p => p.onclick = () => {
      viewerRole = p.dataset.r; initViewbar(); renderAll();
    });
  } else {
    wrap.style.display = 'none'; // Rolle kommt serverseitig vom Worker
  }
  initTeamSelect();
  const ms = document.getElementById('monatSelect');
  const gewaehlt = ms.value;
  ms.innerHTML = monatOptionen().map(m=>`<option value="${m}">${monatLabel(m)}</option>`).join('');
  if ([...ms.options].some(o=>o.value===gewaehlt)) ms.value = gewaehlt;
}
function initTeamSelect(){
  const ts = document.getElementById('teamSelect');
  const teams = scData ? scData.teams : [];
  if (viewerRole === 'tl') {
    ts.innerHTML = teams.map(t=>`<option value="${t.name}">${t.name}</option>`).join('');
    ts.disabled = true;
  } else {
    ts.disabled = false;
    ts.innerHTML = `<option value="*">Alle Teams</option>` + teams.map(t=>`<option value="${t.name}">${t.name}</option>`).join('');
  }
}
async function onMonatChange(){
  const m = document.getElementById('monatSelect').value;
  if (demoMode) { scData = DEMO[m] || DEMO['2026-07']; }
  else {
    document.getElementById('grid').innerHTML = '<div class="skel">Lade ' + monatLabel(m) + ' … (erster Abruf kann bis zu einer Minute dauern)</div>';
    await ladeMonat(m);
    initTeamSelect();
  }
  renderAll();
}

/* ═══ AUTH & DATEN ═══ */
async function initMsal(){
  document.getElementById('versionBadge').textContent = APP_VERSION;
  msalInstance = new msal.PublicClientApplication({
    auth: { clientId: CFG.clientId, authority: `https://login.microsoftonline.com/${CFG.tenantId}`, redirectUri: CFG.redirectUri },
    cache: { cacheLocation: 'localStorage' }
  });
  const resp = await msalInstance.handleRedirectPromise().catch(()=>null);
  currentAccount = resp?.account || msalInstance.getAllAccounts()[0] || null;
  if (currentAccount) startApp();
}
async function doLogin(){
  try { await msalInstance.loginRedirect({ scopes: SCOPES }); }
  catch(e){ showLoginError('Anmeldung fehlgeschlagen: ' + e.message); }
}
function doLogout(){ msalInstance?.logoutRedirect({ account: currentAccount }); }
function showLoginError(msg){ const el = document.getElementById('loginError'); el.textContent = msg; el.style.display = 'block'; }

// ID-Token (Worker-Auth) + Access-Token (Graph, X-Graph-Token) — mit
// forceRefresh, wenn das gecachte ID-Token kurz vor Ablauf steht
async function liveTokens(){
  let r = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account: currentAccount });
  const exp = r.idTokenClaims && r.idTokenClaims.exp;
  if (exp && exp * 1000 - Date.now() < 60000) {
    r = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account: currentAccount, forceRefresh: true });
  }
  return { id: r.idToken, graph: r.accessToken };
}

function startDemo(){
  demoMode = true; viewerRole = 'gf';
  document.getElementById('demoBar').style.display = 'flex';
  showApp('Demo');
  scData = DEMO['2026-07'];
  initViewbar(); renderAll();
}
async function startApp(){
  showApp(currentAccount.name || currentAccount.username);
  const monat = monatOptionen()[0];
  document.getElementById('grid').innerHTML = '<div class="skel">Lade Kennzahlen … (erster Abruf kann bis zu einer Minute dauern)</div>';
  await ladeMonat(monat);
  initViewbar();
  document.getElementById('monatSelect').value = (scData && scData.monat) || monat;
  renderAll();
}
async function ladeMonat(monat){
  if (monatCache[monat]) { scData = monatCache[monat]; viewerRole = scData.rolle || viewerRole; return; }
  try {
    const t = await liveTokens();
    const r = await fetch(CFG.workerUrl + '/api/scorecard?monat=' + encodeURIComponent(monat),
      { headers: { Authorization: 'Bearer ' + t.id, 'X-Graph-Token': t.graph } });
    if (r.status === 403) {
      let detail = ''; try { detail = (await r.json()).error || ''; } catch(_){}
      zeigeKeinZugriff(detail || 'Die Business Scorecard ist der Geschäftsführung vorbehalten.');
      return;
    }
    if (!r.ok) {
      let detail = ''; try { detail = (await r.json()).error || ''; } catch(_){}
      throw new Error('HTTP ' + r.status + (detail ? ' — ' + detail : ''));
    }
    scData = await r.json();
    viewerRole = scData.rolle || 'tl';
    monatCache[monat] = scData;
    graphToken = t.graph;
    if (viewerRole === 'gf' && bwaStatus === null) { ladeBwa().then(() => renderAll()); }
  } catch(e){
    // Endpunkt nicht erreichbar/berechtigt → transparent in den Demo-Modus
    demoMode = true;
    document.getElementById('demoBar').style.display = 'flex';
    document.querySelector('#demoBar span').textContent =
      '— Live-Abruf fehlgeschlagen (' + e.message + '). Fiktive Zahlen.';
    scData = DEMO['2026-07'];
    viewerRole = 'gf';
  }
}
async function aktualisiereMonat(){
  const m = document.getElementById('monatSelect').value;
  document.getElementById('grid').innerHTML = '<div class="skel">Lade aktuellen Kilanka-Stand …</div>';
  delete monatCache[m];
  await ladeMonat(m);
  if (bankTxs && scData && scData.finanzen) { // zuletzt geladene CSV automatisch neu abgleichen
    zahlungsTreffer = matcheZahlungen(scData.finanzen.offeneRechnungen, bankTxs);
    zahlungsTreffer.diag = bankDiag;
  }
  initTeamSelect();
  renderAll();
}
function zeigeKeinZugriff(msg){
  scData = null;
  document.querySelector('.viewbar').style.display = 'none';
  document.getElementById('grid').innerHTML =
    '<div class="card wide" style="text-align:center;padding:32px"><h3 style="justify-content:center">🔒 Kein Zugriff</h3>' +
    '<div class="legend" style="margin-top:8px">' + msg + '</div></div>';
}
function showApp(name){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  document.getElementById('userBadge').style.display = 'flex';
  document.getElementById('userName').textContent = name;
  document.getElementById('logoutBtn').style.display = name==='Demo' ? 'none' : 'inline-flex';
}

// Läuft diese Seite als MSAL-Auth-Popup (z. B. Listen-Anlage)? Dann NICHT die
// App starten — das Hauptfenster liest die Antwort aus der URL und schließt
// das Popup selbst. Sonst blockiert MSAL mit block_nested_popups.
if (window.opener && window.opener !== window && /^msal/.test(window.name || '')) {
  document.body.innerHTML = '<div style="font-family:Kodchasan,sans-serif;padding:40px;text-align:center;color:#6b6860">Anmeldung wird abgeschlossen — dieses Fenster schließt sich gleich …</div>';
} else {
  initMsal();
}
