<!DOCTYPE html>
<html lang="de">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kodchasan:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Organisation — Praxis NeueWege</title>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<style>
:root {
  --bg:#f7f6f2; --surface:#ffffff; --border:#e2dfd8; --border-strong:#c8c4bc;
  --text:#1a1916; --text-muted:#6b6860; --text-hint:#a09e99;
  --accent:#7b3f1e; --accent-light:#f5ede7; --accent-mid:#c47848;
  --error:#9b1c1c; --error-bg:#fef2f2;
  --radius:8px; --radius-lg:12px;
  --hdr-h:56px;
  --indent:28px;
  --row-gap:8px;
  --card-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:100dvh}
body{font-family:'Kodchasan','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:var(--hdr-h);position:sticky;top:0;z-index:100}
.header-brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.header-brand img{height:28px;width:auto}
.header-brand span{font-size:13px;font-weight:600;color:var(--text)}
.header-right{display:flex;align-items:center;gap:8px}
.user-badge{display:none;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.user-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-mid);flex-shrink:0}
.user-photo-sm{width:24px;height:24px;border-radius:50%;object-fit:cover;border:1.5px solid var(--border)}
.version-badge{font-size:10px;font-weight:600;color:var(--text-hint);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px;margin-left:4px;font-family:'Kodchasan',monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;border:none;font-family:inherit;min-height:36px}
.btn-outline{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.btn-outline:hover{background:var(--accent-light)}
.btn-sm{padding:5px 12px;font-size:12px;min-height:30px}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text-muted);font-size:11px;padding:3px 10px;min-height:28px;border-radius:4px}
.btn-ghost:hover{border-color:var(--accent-mid);color:var(--accent)}

/* ── LOGIN ── */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:calc(100dvh - var(--hdr-h));padding:24px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem 1.75rem;max-width:380px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login-card img{height:64px;width:auto;margin-bottom:1.25rem}
.login-title{font-size:18px;font-weight:600;margin-bottom:6px}
.login-desc{font-size:13px;color:var(--text-muted);margin-bottom:1.5rem;line-height:1.6}
.alert{border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-top:1rem}
.alert-error{background:var(--error-bg);color:var(--error);border:1px solid #fecaca}

/* ── APP ── */
#appScreen{display:none;flex-direction:column;min-height:calc(100dvh - var(--hdr-h))}

/* ── PAGE HEADER ── */
.page-header{padding:14px 20px 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--border);background:var(--surface)}
.page-header-left h2{font-size:17px;font-weight:600;color:var(--text)}
.page-header-left p{font-size:12px;color:var(--text-muted);margin-top:1px}
.page-header-actions{display:flex;align-items:center;gap:8px}

/* ── TOOLBAR ── */
.toolbar{padding:10px 20px;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:320px}
.search-input{width:100%;height:34px;border:1px solid var(--border);border-radius:var(--radius);padding:0 10px 0 32px;font-size:12px;font-family:inherit;background:var(--surface);color:var(--text);outline:none}
.search-input:focus{border-color:var(--accent-mid)}
.search-icon-svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-hint);pointer-events:none}
.toolbar-info{font-size:11px;color:var(--text-hint);margin-left:auto}
.expand-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);border:1px solid var(--border);border-radius:5px;padding:3px 10px;background:var(--surface);cursor:pointer;font-family:inherit}
.expand-btn:hover{border-color:var(--accent-mid);color:var(--accent)}

/* ── TREE CONTAINER ── */
.tree-container{padding:28px 24px 60px;overflow-x:auto;min-width:min-content}

/* ── LEVEL 0: Sonja + Markus zentriert ── */
.level-root{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-bottom:0;
}

/* ── CONNECTOR: root → TL-Reihe ── */
.root-to-tl{
  display:flex;
  justify-content:center;
}
.root-to-tl::before{
  content:'';display:block;
  width:1px;height:28px;
  background:var(--border-strong);
}

/* ── TL-REIHE ── */
/* horizontal linie über allen TL-Spalten, dann je ein Tick nach unten */
.tl-row-wrap{
  display:flex;
  justify-content:center;
  position:relative;
}
/* die horizontale Linie wird per JS als absolutes Element eingefügt (nach Layout) */
.tl-hbar{
  position:absolute;
  top:0;height:1px;
  background:var(--border-strong);
  pointer-events:none;
}

/* ── TL-SPALTE ── */
.tl-col{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:0 var(--tl-gap,12px);
}
/* tick oben: horizontale Linie → TL-Card */
.tl-col::before{
  content:'';display:block;
  width:1px;height:16px;
  background:var(--border-strong);
}

/* ── CONNECTOR: TL → FK-Liste ── */
.tl-to-fk{
  width:1px;height:16px;
  background:var(--border-strong);
}

/* ── FK-LISTE (vertikal, mit Linie links) ── */
.fk-list{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  position:relative;
}
.fk-list::before{
  content:'';
  position:absolute;
  left:50%;top:0;
  width:1px;
  bottom:calc(var(--card-h) / 2);
  background:var(--border-strong);
  transform:translateX(-50%);
}
.fk-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  padding-bottom:var(--fk-gap,8px);
}
.fk-item:last-child{padding-bottom:0}

/* ── CARDS ── */
.row-card{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:5px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--card-radius,12px);padding:var(--card-pad,16px 10px 12px);
  cursor:pointer;transition:border-color .15s,box-shadow .12s,transform .1s;
  position:relative;overflow:hidden;
  width:var(--card-w,130px);min-width:var(--card-w,130px);text-align:center;
  /* feste Höhe — alle Kacheln einer Ebene gleich groß */
  height:150px;
}
.row-card.card-root{ height:170px; width:calc(var(--card-w,130px) + 20px);min-width:calc(var(--card-w,130px) + 20px) }
.row-card.card-manager{ height:150px }
.row-card.card-staff{ height:130px }

.row-card:hover{border-color:var(--accent-mid);box-shadow:0 3px 12px rgba(123,63,30,.12);transform:translateY(-2px)}
.row-card.highlight{border-color:var(--accent);border-width:1.5px;box-shadow:0 0 0 3px var(--accent-light)}
.row-card.dimmed{opacity:.3}
.row-card::before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:var(--border-strong)}
/* feste Farben je Ebene */
.row-card.card-root::before   { background:#7b3f1e }
.row-card.card-manager::before{ background:#1565c0 }
.row-card.card-staff::before  { background:#2e7d32 }
.row-avatar{
  width:var(--avatar-sz,52px);height:var(--avatar-sz,52px);border-radius:50%;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:var(--avatar-font,16px);font-weight:700;color:#fff;
  overflow:hidden;border:2px solid var(--border);
}
.row-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.row-avatar.loading{position:relative}
.row-avatar.loading::after{content:'';position:absolute;inset:0;margin:auto;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent-mid);border-radius:50%;animation:spin .8s linear infinite}
.card-root .row-avatar{width:calc(var(--avatar-sz,52px) + 8px);height:calc(var(--avatar-sz,52px) + 8px)}

/* text */
.row-name{font-size:var(--name-font,12px);font-weight:700;color:var(--text);line-height:1.3;word-break:break-word}
.row-title{font-size:var(--title-font,10px);color:var(--text-muted);line-height:1.3}
.row-card.card-staff .row-title,
.row-card.card-manager .row-title{display:none}

/* ── PROFILE SECTION ── */
.drawer-edit-btn{
  font-size:11px;font-family:inherit;cursor:pointer;
  background:none;border:1px solid var(--border);color:var(--text-muted);
  border-radius:5px;padding:3px 9px;
  transition:border-color .1s,color .1s;
}
.drawer-edit-btn:hover{border-color:var(--accent-mid);color:var(--accent)}
.drawer-profile-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;margin-bottom:4px;
}
.drawer-profile-item{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 4px;text-align:center;
}
.drawer-bool-yes{font-size:11px;font-weight:700;color:#2e7d32}
.drawer-bool-no{font-size:11px;color:var(--text-hint)}
.drawer-profile-text{font-size:12px;color:var(--text);line-height:1.6}
.drawer-textarea{
  width:100%;border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 10px;font-size:12px;font-family:inherit;color:var(--text);
  background:var(--surface);resize:vertical;outline:none;
  transition:border-color .12s;
}
.drawer-textarea:focus{border-color:var(--accent-mid)}
.drawer-toggle{display:inline-flex;cursor:pointer;align-items:center}
.drawer-toggle input{display:none}
.drawer-toggle-track{
  width:36px;height:20px;border-radius:20px;
  background:var(--border-strong);position:relative;transition:background .15s;
}
.drawer-toggle input:checked + .drawer-toggle-track{background:var(--accent)}
.drawer-toggle-thumb{
  position:absolute;left:2px;top:2px;
  width:16px;height:16px;border-radius:50%;background:#fff;
  transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.drawer-toggle input:checked + .drawer-toggle-track .drawer-toggle-thumb{left:18px}

/* ── NORDSTERN BADGE ── */
.nordstern-badge{
  position:absolute;top:6px;right:6px;
  width:var(--ns-badge,20px);height:var(--ns-badge,20px);
  opacity:.85;pointer-events:none;
}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--text-muted);font-size:13px}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--accent-mid);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-state{display:flex;flex-direction:column;align-items:center;padding:40px 20px;gap:8px;color:var(--error);font-size:13px;text-align:center}

/* ── DETAIL DRAWER ── */
#drawer{
  position:fixed;right:-360px;top:var(--hdr-h);bottom:0;
  width:300px;background:var(--surface);
  border-left:1px solid var(--border);
  box-shadow:-4px 0 20px rgba(0,0,0,.08);
  transition:right .22s cubic-bezier(.4,0,.2,1);
  z-index:90;overflow-y:auto;padding:20px;
}
#drawer.open{right:0}
#drawer .close-btn{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:18px;padding:4px;line-height:1}
.drawer-avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;overflow:hidden;border:2px solid var(--border)}
.drawer-avatar img{width:100%;height:100%;object-fit:cover}
.drawer-name{font-size:17px;font-weight:700;text-align:center;color:var(--text)}
.drawer-role{font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:16px}
.drawer-section{margin-bottom:12px}
.drawer-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-hint);margin-bottom:5px}
.drawer-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);padding:7px 0;border-bottom:1px solid var(--bg)}
.drawer-row svg{width:15px;height:15px;color:var(--accent-mid);flex-shrink:0}
.drawer-row a{color:var(--accent);text-decoration:none}
.drawer-row a:hover{text-decoration:underline}
.drawer-since{text-align:center;margin-top:16px;font-size:14px;font-weight:700;color:var(--accent);background:var(--accent-light);border-radius:var(--radius);padding:12px}
.drawer-since span{display:block;font-size:11px;font-weight:400;color:var(--text-muted);margin-top:3px}

@media(max-width:700px){
  :root{
    --card-w:88px;
    --avatar-sz:38px;
    --avatar-font:12px;
    --name-font:10px;
    --title-font:9px;
    --tl-gap:8px;
    --fk-gap:6px;
    --card-pad:10px 6px 8px;
    --card-radius:10px;
    --ns-badge:15px;
  }
  .tree-container{padding:10px 8px 40px;overflow-x:auto}
  #drawer{width:100%;right:-100%}
}
@media(min-width:701px){
  :root{
    --card-w:130px;
    --avatar-sz:52px;
    --avatar-font:16px;
    --name-font:12px;
    --title-font:10px;
    --tl-gap:12px;
    --fk-gap:8px;
    --card-pad:16px 10px 12px;
    --card-radius:12px;
    --ns-badge:20px;
  }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-brand" onclick="location.href='index.html'">
    <img src="https://static.wixstatic.com/media/d7fd63_313f7dd84a36440fbc102732bf9c8d50~mv2.png/v1/fill/w_240,h_120,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Sonja%20Peltz%20(500%20%C3%97%20250%20px)%20(1).png" alt="Praxis NeueWege">
    <span>Organisation</span>
    <span id="versionBadge" class="version-badge"></span>
  </div>
  <div class="header-right">
    <div class="user-badge" id="userBadge">
      <img class="user-photo-sm" id="userPhotoSm" src="" alt="" style="display:none">
      <div class="user-dot" id="userDot"></div>
      <span id="userName"></span>
    </div>
    <button class="btn-ghost" onclick="logout()" id="logoutBtn" style="display:none">Abmelden</button>
  </div>
</header>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="https://static.wixstatic.com/media/d7fd63_313f7dd84a36440fbc102732bf9c8d50~mv2.png/v1/fill/w_240,h_120,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Sonja%20Peltz%20(500%20%C3%97%20250%20px)%20(1).png" alt="Praxis NeueWege">
    <div class="login-title">Organisation</div>
    <div class="login-desc">Organigramm &amp; Mitarbeiterverzeichnis von Praxis NeueWege. Bitte mit dem Microsoft-Konto anmelden.</div>
    <button class="btn btn-outline" onclick="login()" id="loginBtn" style="width:100%">
      <svg width="16" height="16" viewBox="0 0 21 21" fill="none"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Mit Microsoft anmelden
    </button>
    <div class="alert alert-error" id="loginError" style="display:none"></div>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <div class="page-header">
    <div class="page-header-left">
      <h2>Organigramm</h2>
      <p id="lastSync">Lade Mitarbeiterdaten …</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-outline btn-sm" onclick="loadOrg()" id="refreshBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        Aktualisieren
      </button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="search" placeholder="Name, Rolle, E-Mail …" id="searchInput" oninput="filterTree(this.value)">
    </div>
    <button class="expand-btn" onclick="toggleAll()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="expandIcon"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      <span id="expandLabel">Alle einklappen</span>
    </button>
    <span class="toolbar-info" id="toolbarInfo"></span>
  </div>

  <div class="tree-container" id="treeContainer">
    <div class="loading-state">
      <div class="spinner"></div>
      Mitarbeiterdaten werden geladen …
    </div>
  </div>
</div>

<!-- DETAIL DRAWER -->
<div id="drawer">
  <button class="close-btn" onclick="closeDrawer()" aria-label="Schließen">✕</button>
  <div id="drawerContent"></div>
</div>

<script>
const CFG = {
  clientId: 'f7e00950-2421-43b5-b48a-447bf8e7d4b3',
  tenantId: '1ac059d9-8d39-43ab-a8db-bd9197bde0f4',
  redirectUri: 'https://apps.praxisneuewege.de/organisation.html'
};
const SCOPES = ['User.Read', 'User.ReadBasic.All', 'Sites.ReadWrite.All'];
const SP_SITE  = 'praxisneuewegesonjapeltz978.sharepoint.com';
const SP_LIST  = 'Mitarbeiter_Profil';
const SP_SITE_ID = '2d413d43-e9b6-41bd-8879-137937a86ba9'; // fest, ändert sich nie
let _spSiteId  = SP_SITE_ID;
let _spListId  = null;
let _currentUserId = null; // Azure AD id des eingeloggten Users
let _currentUserMail = null;
let _profileCache = {};   // mail -> SP-Profil-Objekt
const APP_VERSION = 'v9d25ed5'; // auto-updated on deploy // auto-updated on deploy

let msalInstance, currentAccount, accessToken;
let orgData = [];
let allExpanded = true;

function applyVersionBadge() {
  const el = document.getElementById('versionBadge');
  if (el) el.textContent = APP_VERSION;
}

/* ── MSAL ── */
async function initApp() {
  const msalConfig = {
    auth: { clientId: CFG.clientId, authority: `https://login.microsoftonline.com/${CFG.tenantId}`, redirectUri: CFG.redirectUri },
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true },
    system: { allowNativeBroker: false }
  };
  msalInstance = new msal.PublicClientApplication(msalConfig);
  await msalInstance.initialize();
  applyVersionBadge();
  try {
    const r = await msalInstance.handleRedirectPromise();
    if (r) { currentAccount = r.account; accessToken = r.accessToken; await showApp(); return; }
  } catch(e) { console.warn(e); }
  const accs = msalInstance.getAllAccounts();
  if (accs.length > 0) { currentAccount = accs[0]; await getToken(); await showApp(); }
}

async function login() {
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  btn.disabled = true; errEl.style.display = 'none';
  try { await msalInstance.loginRedirect({ scopes: SCOPES }); }
  catch(e) {
    btn.disabled = false;
    errEl.style.display = 'block';
    errEl.textContent = 'Fehler: ' + (e.errorMessage || e.message);
  }
}

async function logout() {
  await msalInstance.logoutRedirect({ postLogoutRedirectUri: CFG.redirectUri });
}

async function getToken() {
  if (!currentAccount) return null;
  try {
    const r = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account: currentAccount });
    accessToken = r.accessToken; return accessToken;
  } catch(e) {
    await msalInstance.acquireTokenRedirect({ scopes: SCOPES });
  }
}

async function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  const app = document.getElementById('appScreen');
  app.style.display = 'flex'; app.style.flexDirection = 'column';
  document.getElementById('userBadge').style.display = 'flex';
  document.getElementById('userName').textContent = currentAccount?.name || currentAccount?.username || '';
  document.getElementById('logoutBtn').style.display = '';
  // Store current user identity for permission checks
  _currentUserMail = currentAccount?.username?.toLowerCase() || '';
  try {
    const token = await getToken();
    const me = await (await fetch('https://graph.microsoft.com/v1.0/me?$select=id,mail', { headers:{Authorization:'Bearer '+token} })).json();
    _currentUserId = me.id;
    _currentUserMail = (me.mail || _currentUserMail).toLowerCase();
  } catch(e) {}
  loadOwnPhoto();
  await ensureSpList();
  await preloadAllProfiles();
  await loadOrg();
}

async function loadOwnPhoto() {

/* ── LOAD USERS ── */
async function loadOrg() {
  const token = await getToken();
  document.getElementById('treeContainer').innerHTML = '<div class="loading-state"><div class="spinner"></div>Mitarbeiterdaten werden geladen …</div>';
  document.getElementById('lastSync').textContent = 'Lade …';
  try {
    let url = 'https://graph.microsoft.com/v1.0/users?$select=id,displayName,givenName,surname,mail,mobilePhone,jobTitle,createdDateTime&$expand=manager($select=id,displayName)&$top=50&$filter=accountEnabled eq true';
    let users = [];
    while (url) {
      const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) throw new Error('Graph Fehler: ' + r.status);
      const data = await r.json();
      users = users.concat(data.value || []);
      url = data['@odata.nextLink'] || null;
    }
    // Bekannte Service-Accounts / App-Mailboxen ausschließen
    const SERVICE_NAMES = ['canva','spesen','rechnung','krankmeldung','fax','nordstern'];
    users = users.filter(u => {
      if (!u.mail || !u.displayName) return false;
      if (u.displayName.startsWith('On-Premises')) return false;
      if (!u.mail.toLowerCase().endsWith('@praxisneuewege.de')) return false;
      const lc = u.displayName.toLowerCase();
      if (SERVICE_NAMES.some(s => lc.startsWith(s))) return false;
      return true;
    });
    // Markus Peltz als Root behandeln: Manager-Referenz entfernen damit er auf Root-Ebene landet
    users = users.map(u => u.displayName === 'Markus Peltz' ? {...u, manager: null} : u);
    orgData = users;
    buildTree(users);
    const now = new Date();
    document.getElementById('lastSync').textContent =
      `${users.length} Mitarbeiter · Stand ${now.toLocaleDateString('de-DE')} ${now.toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'})} Uhr`;
    document.getElementById('toolbarInfo').textContent = `${users.length} Personen`;
  } catch(e) {
    console.error(e);
    document.getElementById('treeContainer').innerHTML =
      `<div class="error-state"><strong>Fehler beim Laden</strong><span>${e.message}</span><button class="btn btn-outline btn-sm" onclick="loadOrg()" style="margin-top:8px">Erneut versuchen</button></div>`;
    document.getElementById('lastSync').textContent = 'Fehler beim Laden';
  }
}

/* ── BUILD 3-LEVEL LAYOUT ── */
function buildTree(users) {
  const inSet = new Set(users.map(u => u.id));
  const roots = users.filter(u => !u.manager || !inSet.has(u.manager.id));

  const children = {};
  users.forEach(u => {
    const mid = u.manager?.id;
    if (mid && inSet.has(mid)) {
      if (!children[mid]) children[mid] = [];
      children[mid].push(u);
    }
  });
  const sortFn = arr => arr.sort((a,b) => a.displayName.localeCompare(b.displayName, 'de'));
  Object.values(children).forEach(sortFn);

  // Nordstern-Set: alle User die selbst Nordstern-Rolle haben ODER deren TL Nordstern-Rolle hat
  const nordsternTLIds = new Set(
    users.filter(u => {
      const t = (u.jobTitle||'').toLowerCase();
      return t.includes('nordstern') || t.includes('wohngruppe');
    }).map(u => u.id)
  );
  const nordsternSet = new Set(
    users.filter(u => {
      const t = (u.jobTitle||'').toLowerCase();
      const isNS = t.includes('nordstern') || t.includes('wohngruppe');
      const underNS = u.manager && nordsternTLIds.has(u.manager.id);
      return isNS || underNS;
    }).map(u => u.id)
  );
  const withDate = users.filter(u => u.createdDateTime);
  const jungerAls = {};
  users.forEach(u => {
    if (!u.createdDateTime) { jungerAls[u.id] = null; return; }
    const t = new Date(u.createdDateTime).getTime();
    jungerAls[u.id] = withDate.filter(v => v.id !== u.id && new Date(v.createdDateTime).getTime() > t).length;
  });

  const container = document.getElementById('treeContainer');
  container.innerHTML = '';

  // Sort roots: most children first (Sonja), then others (Markus)
  const sortedRoots = [...roots].sort((a,b) => (children[b.id]||[]).length - (children[a.id]||[]).length);
  const primaryRoot = sortedRoots[0]; // Sonja
  const tls = children[primaryRoot?.id] || [];

  // ── EBENE 0: Roots nebeneinander zentriert ──
  const lvl0 = document.createElement('div');
  lvl0.className = 'level-root';
  sortedRoots.forEach(r => lvl0.appendChild(makeRowCard(r, 0, jungerAls, 'card-root', nordsternSet)));
  container.appendChild(lvl0);

  if (tls.length === 0) return;

  // Verbindungslinie Sonja → TL-Reihe
  const rootToTl = document.createElement('div');
  rootToTl.className = 'root-to-tl';
  container.appendChild(rootToTl);

  // ── EBENE 1: TL-Spalten ──
  const tlRowWrap = document.createElement('div');
  tlRowWrap.className = 'tl-row-wrap';

  tls.forEach(tl => {
    const tlCol = document.createElement('div');
    tlCol.className = 'tl-col';

    // TL-Card
    tlCol.appendChild(makeRowCard(tl, 1, jungerAls, 'card-manager', nordsternSet));

    // ── EBENE 2: FK-Liste unter diesem TL ──
    const staff = children[tl.id] || [];
    if (staff.length > 0) {
      // Verbindungslinie TL → FK
      const tlToFk = document.createElement('div');
      tlToFk.className = 'tl-to-fk';
      tlCol.appendChild(tlToFk);

      const fkList = document.createElement('div');
      fkList.className = 'fk-list';
      fkList.style.setProperty('--card-h', '130px'); // approx card height for connector calc

      staff.forEach(s => {
        const item = document.createElement('div');
        item.className = 'fk-item';
        item.appendChild(makeRowCard(s, 2, jungerAls, 'card-staff', nordsternSet));
        fkList.appendChild(item);
      });

      tlCol.appendChild(fkList);
    }

    tlRowWrap.appendChild(tlCol);
  });

  container.appendChild(tlRowWrap);

  // Draw horizontal bar across TL columns after layout
  requestAnimationFrame(() => {
    const tlCols = tlRowWrap.querySelectorAll(':scope > .tl-col');
    if (tlCols.length < 2) return;
    const wrapRect = tlRowWrap.getBoundingClientRect();
    // get mid-x of first and last TL card
    const firstCard = tlCols[0].querySelector('.row-card');
    const lastCard  = tlCols[tlCols.length-1].querySelector('.row-card');
    if (!firstCard || !lastCard) return;
    const fR = firstCard.getBoundingClientRect();
    const lR = lastCard.getBoundingClientRect();
    const left  = (fR.left + fR.width/2) - wrapRect.left;
    const right = (lR.left + lR.width/2) - wrapRect.left;
    const bar = document.createElement('div');
    bar.className = 'tl-hbar';
    bar.style.left  = left + 'px';
    bar.style.width = (right - left) + 'px';
    tlRowWrap.appendChild(bar);
  });

  loadPhotosAsync(users);
}

/* ── MAKE ROW CARD ── */
function makeRowCard(user, depth, jungerAls, cardClass, nordsternSet) {
  const roleInfo = getRoleInfo(user, depth);

  const card = document.createElement('div');
  card.className = 'row-card' + (cardClass ? ' ' + cardClass : '');
  card.dataset.userId = user.id;
  card.dataset.name = (user.displayName || '').toLowerCase();
  card.dataset.email = (user.mail || '').toLowerCase();
  card.dataset.job = (user.jobTitle || '').toLowerCase();
  card.style.setProperty('--role-color', roleInfo.color);

  // avatar
  const av = document.createElement('div');
  av.className = 'row-avatar loading';
  av.id = 'avatar-' + user.id;
  av.style.background = roleInfo.color;
  av.dataset.initials = initials(user.displayName);
  card.appendChild(av);

  // name
  const nm = document.createElement('div');
  nm.className = 'row-name';
  nm.textContent = user.displayName;
  card.appendChild(nm);

  // role/job title
  const jt = document.createElement('div');
  jt.className = 'row-title';
  jt.textContent = user.jobTitle || roleInfo.label;
  card.appendChild(jt);

  // Nordstern badge (Kompassrose) rechts oben
  if (nordsternSet?.has(user.id)) {
    const ns = document.createElement('div');
    ns.className = 'nordstern-badge';
    ns.title = 'Nordstern Wolnzach';
    ns.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="12,2 13.5,10.5 22,12 13.5,13.5 12,22 10.5,13.5 2,12 10.5,10.5" fill="#1565c0" opacity="0.85"/>
      <polygon points="12,2 12.7,10.5 22,12 12.7,13.5 12,22 11.3,13.5 2,12 11.3,10.5" fill="#1565c0"/>
      <circle cx="12" cy="12" r="2" fill="white"/>
    </svg>`;
    card.appendChild(ns);
  }

  card.addEventListener('click', () => openDrawer(user, roleInfo, jungerAls));
  return card;
}

/* ── ROLES ── */
function getRoleInfo(user, depth) {
  const title = (user.jobTitle || '').toLowerCase();
  if (depth === 0) return { color:'#7b3f1e', label:'Geschäftsführung' };
  if (title.includes('nordstern') || title.includes('wohngruppe')) return { color:'#1565c0', label:'Nordstern' };
  if (title.includes('teamleitung') || title.includes('leitung ambulant')) return { color:'#2e7d32', label:'TL Ambulant' };
  if (title.includes('verwaltung')) return { color:'#5a3e78', label:'Verwaltung' };
  if (title.includes('ambulant') || title.includes('spfh') || title.includes('sozialpäd') || title.includes('erzieher') || title.includes('erzieherin')) return { color:'#388e3c', label:'Ambulant' };
  if (depth === 1) return { color:'#5a3e78', label: user.jobTitle || 'Leitung' };
  return { color:'#6b6860', label: user.jobTitle || 'Mitarbeiter' };
}

function initials(name) {
  if (!name) return '?';
  return name.split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

function daysSince(iso) {
  return Math.floor((Date.now() - new Date(iso)) / 86400000);
}

/* ── PHOTOS ── */
async function loadPhotosAsync(users) {
  const token = await getToken();
  for (const user of users) {
    const el = document.getElementById('avatar-' + user.id);
    if (!el) continue;
    try {
      const r = await fetch(`https://graph.microsoft.com/v1.0/users/${user.id}/photo/$value`, {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (r.ok) {
        const url = URL.createObjectURL(await r.blob());
        el.classList.remove('loading');
        el.innerHTML = `<img src="${url}" alt="${user.displayName}">`;
      } else { setInitials(el); }
    } catch(e) { setInitials(el); }
  }
}
function setInitials(el) {
  el.classList.remove('loading');
  el.textContent = el.dataset.initials || '?';
}

/* ── SEARCH ── */
function filterTree(q) {
  const term = q.trim().toLowerCase();
  const cards = document.querySelectorAll('.row-card');
  if (!term) {
    cards.forEach(c => { c.classList.remove('dimmed','highlight'); });
    document.getElementById('toolbarInfo').textContent = orgData.length + ' Personen';
    return;
  }
  let hits = 0;
  cards.forEach(c => {
    const match = c.dataset.name.includes(term) || c.dataset.email.includes(term) || c.dataset.job.includes(term);
    if (match) { c.classList.remove('dimmed'); hits++; } else { c.classList.add('dimmed'); }
  });
  document.getElementById('toolbarInfo').textContent = `${hits} Treffer`;
}

/* ── SHAREPOINT: LISTE SICHERSTELLEN ── */
async function ensureSpList() {
  if (_spListId) return; // bereits gecacht
  try {
    const token = await getToken();
    // Nur Listen-ID holen — Site-ID ist fest eingebaut
    const lr = await fetch(
      `https://graph.microsoft.com/v1.0/sites/${_spSiteId}/lists?$filter=displayName eq '${SP_LIST}'&$select=id,displayName`,
      {headers:{Authorization:'Bearer '+token}}
    );
    if (!lr.ok) { console.warn('SP Listen-Abfrage fehlgeschlagen:', lr.status); return; }
    const ld = await lr.json();
    if (ld.value && ld.value.length > 0) {
      _spListId = ld.value[0].id;
      console.log('SP Liste gefunden:', SP_LIST, _spListId);
    } else {
      console.warn(`SP Liste "${SP_LIST}" nicht gefunden — bitte in SharePoint anlegen.`);
    }
  } catch(e) { console.warn('SP list init error:', e); }
}

/* ── PROFIL LADEN ── */
/* ── ALLE PROFILE EINMALIG LADEN & CACHEN ── */
let _profilesLoaded = false;
async function preloadAllProfiles() {
  if (_profilesLoaded || !_spSiteId || !_spListId) return;
  try {
    const token = await getToken();
    let url = `https://graph.microsoft.com/v1.0/sites/${_spSiteId}/lists/${_spListId}/items?expand=fields&$top=200`;
    while (url) {
      const r = await fetch(url, {headers:{Authorization:'Bearer '+token}});
      if (!r.ok) break;
      const d = await r.json();
      (d.value || []).forEach(item => {
        const mail = (item.fields?.Email || '').toLowerCase();
        if (mail) _profileCache[mail] = { itemId: item.id, ...item.fields };
      });
      url = d['@odata.nextLink'] || null;
    }
    _profilesLoaded = true;
  } catch(e) { console.warn('preloadAllProfiles error:', e); }
}

async function loadProfile(mail) {
  if (!_spSiteId || !_spListId) return null;
  const key = mail.toLowerCase();
  // Wenn noch nicht alle geladen → jetzt laden
  if (!_profilesLoaded) await preloadAllProfiles();
  return _profileCache[key] || null;
}

/* ── PROFIL SPEICHERN ── */
async function saveProfile(mail, itemId, fields) {
  if (!_spSiteId || !_spListId) {
    await ensureSpList();
    if (!_spSiteId || !_spListId) throw new Error('SharePoint-Liste nicht erreichbar. Bitte Seite neu laden.');
  }
  const token = await getToken();
  const payload = {
    Email: mail,
    Zusatzausbildung: fields.zusatz || '',
    Themenschwerpunkte: fields.schwerpunkte || '',
    ISEF: !!fields.isef,
    Teamleitung: !!fields.tl,
    Stationaer: !!fields.stationaer
  };
  if (itemId) {
    const r = await fetch(
      `https://graph.microsoft.com/v1.0/sites/${_spSiteId}/lists/${_spListId}/items/${itemId}/fields`,
      {method:'PATCH', headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}, body:JSON.stringify(payload)}
    );
    if (!r.ok) throw new Error('Update fehlgeschlagen: ' + r.status);
  } else {
    const r = await fetch(
      `https://graph.microsoft.com/v1.0/sites/${_spSiteId}/lists/${_spListId}/items`,
      {method:'POST', headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
       body:JSON.stringify({fields: payload})}
    );
    if (!r.ok) throw new Error('Erstellen fehlgeschlagen: ' + r.status);
    const nd = await r.json();
    itemId = nd.id;
  }
  // Direkt in Cache schreiben — kein zweiter API-Call nötig
  const key = mail.toLowerCase();
  const cached = { itemId, Email: mail, ...payload };
  _profileCache[key] = cached;
  return cached;
}

/* ── PROFIL LÖSCHEN ── */
async function deleteProfile(mail, itemId) {
  if (!_spSiteId || !_spListId || !itemId) return;
  const token = await getToken();
  await fetch(
    `https://graph.microsoft.com/v1.0/sites/${_spSiteId}/lists/${_spListId}/items/${itemId}`,
    {method:'DELETE', headers:{Authorization:'Bearer '+token}}
  );
  delete _profileCache[mail.toLowerCase()];
}

/* ── BEARBEITUNGSBERECHTIGUNG ── */
function canEdit(user) {
  if (!_currentUserMail) return false;
  // Eigenes Profil
  if (user.mail?.toLowerCase() === _currentUserMail) return true;
  // TL: darf Mitarbeiter bearbeiten, deren Manager = aktueller User
  const me = orgData.find(u => u.mail?.toLowerCase() === _currentUserMail);
  if (!me) return false;
  return user.manager?.id === me.id;
}

/* ── DRAWER ── */
async function openDrawer(user, roleInfo, jungerAls) {
  document.querySelectorAll('.row-card').forEach(c => c.classList.remove('highlight'));
  const card = document.querySelector(`.row-card[data-user-id="${user.id}"]`);
  if (card) card.classList.add('highlight');

  const days = user.createdDateTime ? daysSince(user.createdDateTime) : null;
  const startDate = user.createdDateTime ? new Date(user.createdDateTime).toLocaleDateString('de-DE') : '';
  const junger = jungerAls?.[user.id] ?? (orgData.length > 0 && user.createdDateTime
    ? orgData.filter(v => v.createdDateTime && v.id !== user.id && new Date(v.createdDateTime).getTime() > new Date(user.createdDateTime).getTime()).length
    : null);

  const srcAv = document.getElementById('avatar-' + user.id);
  let avatarHtml;
  if (srcAv?.querySelector('img')) {
    avatarHtml = `<div class="drawer-avatar"><img src="${srcAv.querySelector('img').src}" alt=""></div>`;
  } else {
    avatarHtml = `<div class="drawer-avatar" style="background:${roleInfo.color}">${initials(user.displayName)}</div>`;
  }

  // Drawer sofort öffnen mit Basis-Info, Profil-Section zeigt Ladeindikator
  const dc = document.getElementById('drawerContent');
  dc.innerHTML = `
    ${avatarHtml}
    <div class="drawer-name">${user.displayName}</div>
    <div class="drawer-role">${user.jobTitle || roleInfo.label}</div>
    <hr style="border:none;border-top:1px solid var(--border);margin:14px 0">
    <div class="drawer-section">
      <div class="drawer-label">Kontakt</div>
      ${user.mail ? `<div class="drawer-row">${mailSvg()}<a href="mailto:${user.mail}">${user.mail}</a></div>` : ''}
      ${user.mobilePhone ? `<div class="drawer-row">${phoneSvg()}<a href="tel:${user.mobilePhone.replace(/\s/g,'')}">${user.mobilePhone}</a></div>` : ''}
    </div>
    ${days !== null ? `
    <div class="drawer-since">
      ${days.toLocaleString('de-DE')} Tage bei Praxis NeueWege
      <span>Dabei seit ${startDate}</span>
      ${junger !== null ? `<span style="margin-top:4px;font-size:11px;color:var(--accent)">${junger === 0 ? '✦ Jüngste/r im Team' : `${junger} Teammitglied${junger === 1 ? '' : 'er'} danach dazugekommen`}</span>` : ''}
    </div>` : ''}
    ${user.manager ? `<div class="drawer-section" style="margin-top:14px"><div class="drawer-label">Vorgesetzte/r</div><div class="drawer-row" style="font-size:13px">${user.manager.displayName}</div></div>` : ''}
    <hr style="border:none;border-top:1px solid var(--border);margin:14px 0">
    <div id="profileSection"><div style="text-align:center;padding:12px 0;font-size:12px;color:var(--text-hint)">Profil wird geladen …</div></div>
  `;
  document.getElementById('drawer').classList.add('open');

  // Profil async laden
  const profile = user.mail ? await loadProfile(user.mail) : null;
  renderProfileSection(user, roleInfo, profile, jungerAls);
}

    </div>` : (editable ? `<div class="drawer-section" style="margin-top:10px"><div class="drawer-label">Zusatzausbildung / Weiterbildungen</div><div class="drawer-profile-text" style="color:var(--text-hint);font-style:italic">Noch keine Angaben</div></div>` : '')}

    ${profile?.Themenschwerpunkte ? `
    <div class="drawer-section" style="margin-top:10px">
      <div class="drawer-label">Themenschwerpunkte</div>
      <div class="drawer-profile-text">${profile.Themenschwerpunkte.replace(/\n/g,'<br>')}</div>
    </div>` : (editable ? `<div class="drawer-section" style="margin-top:10px"><div class="drawer-label">Themenschwerpunkte</div><div class="drawer-profile-text" style="color:var(--text-hint);font-style:italic">Noch keine Angaben</div></div>` : '')}
    ` : ''}
  `;
}

/* ── EDIT FORMULAR ── */
function openEditForm(mail, itemId, userId) {
  const ps = document.getElementById('profileSection');
  if (!ps) return;
  const profile = _profileCache[mail] || {};
  const chk = (v,id) => `<label class="drawer-toggle"><input type="checkbox" id="${id}" ${v?'checked':''}><span class="drawer-toggle-track"><span class="drawer-toggle-thumb"></span></span></label>`;

  ps.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="drawer-label" style="margin-bottom:0">Profil bearbeiten</div>
      <button class="drawer-edit-btn" onclick="cancelEdit('${mail}','${itemId}','${userId}')">✕ Abbrechen</button>
    </div>

    <div class="drawer-profile-grid" style="margin-bottom:12px">
      <div class="drawer-profile-item">
        <div class="drawer-label" style="font-size:9px">ISEF</div>
        ${chk(profile.ISEF,'ep-isef')}
      </div>
      <div class="drawer-profile-item">
        <div class="drawer-label" style="font-size:9px">Teamleitung</div>
        ${chk(profile.Teamleitung,'ep-tl')}
      </div>
      <div class="drawer-profile-item">
        <div class="drawer-label" style="font-size:9px">Stationär</div>
        ${chk(profile.Stationaer,'ep-stat')}
      </div>
    </div>

    <div class="drawer-section" style="margin-bottom:10px">
      <div class="drawer-label">Zusatzausbildung / Weiterbildungen</div>
      <textarea id="ep-zusatz" class="drawer-textarea" placeholder="z.B. Traumapädagogik, systemische Beratung …" rows="3">${profile.Zusatzausbildung||''}</textarea>
    </div>

    <div class="drawer-section" style="margin-bottom:14px">
      <div class="drawer-label">Themenschwerpunkte</div>
      <textarea id="ep-schwerpunkte" class="drawer-textarea" placeholder="z.B. Sucht, häusliche Gewalt, Trauer …" rows="3">${profile.Themenschwerpunkte||''}</textarea>
    </div>

    <div style="display:flex;gap:8px">
      <button class="btn btn-outline btn-sm" style="flex:1" onclick="submitProfile('${mail}','${itemId}','${userId}')">💾 Speichern</button>
      ${itemId ? `<button class="btn btn-sm" style="background:var(--error-bg);color:var(--error);border:1px solid #fecaca" onclick="confirmDeleteProfile('${mail}','${itemId}','${userId}')">🗑 Löschen</button>` : ''}
    </div>
    <div id="ep-msg" style="font-size:11px;margin-top:8px;text-align:center"></div>
  `;
}

async function submitProfile(mail, itemId, userId) {
  const btn = document.querySelector('#profileSection .btn-outline');
  if (btn) { btn.disabled = true; btn.textContent = 'Speichert …'; }
  try {
    const fields = {
      zusatz:       document.getElementById('ep-zusatz')?.value || '',
      schwerpunkte: document.getElementById('ep-schwerpunkte')?.value || '',
      isef:         document.getElementById('ep-isef')?.checked || false,
      tl:           document.getElementById('ep-tl')?.checked || false,
      stationaer:   document.getElementById('ep-stat')?.checked || false,
    };
    const savedProfile = await saveProfile(mail, itemId||null, fields);
    const user = orgData.find(u => u.id === userId);
    const roleInfo = user ? getRoleInfo(user, 1) : {color:'#6b6860',label:''};
    renderProfileSection(user, roleInfo, savedProfile, null);
  } catch(e) {
    const msg = document.getElementById('ep-msg');
    if (msg) msg.innerHTML = `<span style="color:var(--error)">Fehler: ${e.message}</span>`;
    if (btn) { btn.disabled = false; btn.textContent = '💾 Speichern'; }
  }
}

function cancelEdit(mail, itemId, userId) {
  const user = orgData.find(u => u.id === userId);
  const roleInfo = user ? getRoleInfo(user, 1) : {color:'#6b6860',label:''};
  const profile = _profileCache[mail] || null;
  renderProfileSection(user, roleInfo, profile, null);
}

async function confirmDeleteProfile(mail, itemId, userId) {
  if (!confirm('Profildaten wirklich löschen?')) return;
  await deleteProfile(mail, itemId);
  const user = orgData.find(u => u.id === userId);
  const roleInfo = user ? getRoleInfo(user, 1) : {color:'#6b6860',label:''};
  renderProfileSection(user, roleInfo, null, null);
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.querySelectorAll('.row-card').forEach(c => c.classList.remove('highlight'));
}

/* ── INIT ── */
initApp().catch(e => {
  document.getElementById('loginScreen').innerHTML +=
    `<p style="color:var(--error);font-size:12px;margin-top:8px">Init-Fehler: ${e.message}</p>`;
});
</script>
</body>
