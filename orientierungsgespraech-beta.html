:root{

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100dvh}
body{font-family:'Kodchasan','Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}

.beta-badge{font-size:10px;font-weight:700;color:#fff;background:var(--accent-mid);border-radius:4px;padding:1px 7px;letter-spacing:.4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;min-height:36px;transition:all .12s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#68351a}

.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--border-strong);color:var(--text)}

.login img{height:60px;margin-bottom:18px}

.login p{color:var(--text-muted);font-size:13px;margin-bottom:18px}
.msg{display:none;border-radius:var(--radius);padding:10px 14px;font-size:13px;margin:12px 0;text-align:left}
.msg.err{display:block;background:var(--error-bg);color:var(--error);border:1px solid #fca5a5}
.msg.warn{display:block;background:var(--warn-bg);color:var(--warn);border:1px solid #fcd34d}
.msg.ok{display:block;background:var(--ok-bg);color:var(--ok);border:1px solid #a7d7bd}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

dialog.kz{border:1px solid var(--border);border-radius:var(--radius-lg);padding:0;max-width:860px;width:calc(100% - 32px);box-shadow:0 12px 40px rgba(0,0,0,.18)}

dialog.kz .kz-kopf h3{font-family:'Libre Baskerville',serif;font-size:17px;color:var(--dunkelbraun)}
dialog.kz .kz-body{padding:14px 22px 20px;max-height:70vh;overflow:auto}
.footer-note{text-align:center;font-size:11px;color:var(--text-hint);margin-top:18px}

/* ── Druck: DIN A4 ── */
@page{size:A4;margin:14mm 13mm}
@media print{
  body{background:#fff;font-size:10.5pt}

const num = (v, einheit='') => v == null || v === '' ? '—' : String(v).replace('.', ',') + einheit;

/* ═══════════════════════════════════════════════════════════
 * ANMELDUNG — defensiv nach Mobilfunk-Muster (lazy, typeof-Prüfung, sessionStorage)

function zeigeLoginFehler(t){ const e=document.getElementById('loginError'); e.className='msg err'; e.textContent=t; }
function initMsal(){
  if (typeof msal === 'undefined') throw new Error('Die Microsoft-Anmeldebibliothek konnte nicht geladen werden. Bitte Seite neu laden (Strg+F5) oder Werbeblocker prüfen.');
  msalInstance = msalInstance || new msal.PublicClientApplication({
    auth:{ clientId:CFG.clientId, authority:'https://login.microsoftonline.com/'+CFG.tenantId, redirectUri:CFG.redirectUri },
    cache:{ cacheLocation:'sessionStorage' }
  });
}
async function login(){
  try{
    initMsal();
    const res = await msalInstance.loginPopup({scopes:SCOPES});
    currentAccount = res.account; msalInstance.setActiveAccount(currentAccount);
    upn = (currentAccount.username||'').toLowerCase();
    istGF = GF.includes(upn);
    document.getElementById('userName').textContent = currentAccount.name || upn;
    document.getElementById('userBadge').style.display='flex';
    document.getElementById('logoutBtn').style.display='';
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appScreen').style.display='block';
    await start();
  }catch(e){ zeigeLoginFehler('Anmeldung fehlgeschlagen: '+e.message); }
}
/* Sitzung wiederaufnehmen (z. B. nach Rundenwechsel/Reload) — ohne erneutes Popup */
async function wiederaufnahme(){
  try{
    initMsal();
    const acc = msalInstance.getAllAccounts()[0];
    if(!acc) return;
    currentAccount = acc; msalInstance.setActiveAccount(acc);
    upn = (acc.username||'').toLowerCase(); istGF = GF.includes(upn);
    document.getElementById('userName').textContent = acc.name || upn;
    document.getElementById('userBadge').style.display='flex';
    document.getElementById('logoutBtn').style.display='';
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appScreen').style.display='block';
    await start();
  }catch(e){ console.warn('Keine Wiederaufnahme —', e.message); }
}
window.addEventListener('load', wiederaufnahme);
function logout(){ if(msalInstance) msalInstance.logoutPopup({account:currentAccount}).catch(()=>{}); location.href=location.pathname; }
async function tokens(){
  const req={scopes:SCOPES,account:currentAccount};
  let r = await msalInstance.acquireTokenSilent(req).catch(()=>msalInstance.acquireTokenPopup(req));
  const exp = (()=>{try{return JSON.parse(atob(r.idToken.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch(e){return 0}})();
  if (exp < Date.now()+60000) r = await msalInstance.acquireTokenSilent({...req,forceRefresh:true});
  return {graph:r.accessToken, id:r.idToken};   // Worker prüft das idToken (aud = clientId)
}
async function graph(pfad,opt={}){
  const t=(await tokens()).graph;
  const r=await fetch(pfad.startsWith('http')?pfad:'https://graph.microsoft.com/v1.0'+pfad,{...opt,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('Graph '+r.status+': '+(await r.text()).slice(0,300));
  return r.status===204?true:r.json();
}
/* Sammlungen IMMER paginiert laden (@odata.nextLink) */
async function graphAlle(pfad){
  const alle=[]; let url='https://graph.microsoft.com/v1.0'+pfad;
  for(let s=0; url && s<50; s++){ const d=await graph(url); if(!d) return null; alle.push(...(d.value||[])); url=d['@odata.nextLink']||null; }
  return alle;
}

const app = () => document.getElementById('appScreen');
function lade(text){ app().className='wrap'; app().innerHTML=`<div class="card"><span class="spinner"></span>${esc(text)}</div>`; document.getElementById('leiste').style.display='none'; }
function meldung(art,html){ app().className='wrap'; app().innerHTML=`<div class="card"><div class="msg ${art}" style="margin:0">${html}</div></div>`; document.getElementById('leiste').style.display='none'; }

async function start(){
  lade('Daten werden geladen …');
  let roh;
  try{ roh = await graphAlle(LISTE()+'/items?$expand=fields&$top=200'); }
  catch(e){ return meldung('err','Die Ablage konnte nicht gelesen werden: '+esc(e.message)); }
  if (roh === null){
    if (istGF) return zeigeSetup();
    return meldung('warn','Die Orientierungsgespräche sind noch nicht eingerichtet. Bitte wende dich an die Verwaltung.');
  }
  items = roh.map(i=>({spId:i.id, f:i.fields||{}}));

  /* Fail-closed: Sieht ein:e Mitarbeiter:in fremde Elemente (oder das GF-Sentinel),
   * sind die Listenberechtigungen falsch — dann wird NICHT gespeichert. */
  if (!istGF && items.some(i => (i.f.MitarbeiterUpn||'').toLowerCase() !== upn)){
    return meldung('err','<b>Sicherheitsprüfung fehlgeschlagen.</b> Die Ablage ist nicht korrekt abgesichert – aus Datenschutzgründen ist das Ausfüllen gesperrt. Bitte gib der Verwaltung Bescheid (Markus Peltz).');
  }
  const ma = (P.get('ma')||'').toLowerCase();
  if (istGF && !(ma && ma===upn && P.get('selbst'))) return ma ? oeffneFuerGF(ma) : zeigeAdmin();
  if (ma && ma !== upn) return meldung('warn','Dieser Link ist für ein anderes Konto bestimmt ('+esc(ma)+'). Du bist angemeldet als '+esc(upn)+'.');
  if (!P.get('r') || !VERSIONEN[P.get('v')]) return meldung('warn','Der Link ist unvollständig. Bitte verwende den Link aus deiner Einladung.');
  await oeffneEigenen();
}

/* Teamleitung = Vorgesetzte:r in Entra (dieselbe Hierarchie wie Organisation-App und Cockpit). Fail-soft. */
async function holeTeamleitung(zielUpn){
  try{
    const pfad = (zielUpn && zielUpn!==upn) ? `/users/${encodeURIComponent(zielUpn)}/manager` : '/me/manager';
    const m = await graph(pfad+'?$select=displayName,mail,userPrincipalName');
    return m ? { name:m.displayName||'', mail:(m.mail||m.userPrincipalName||'').toLowerCase() } : null;
  }catch(e){ console.warn('Teamleitung nicht ermittelbar —', e.message); return null; }
}
async function holeKennzahlen(zielUpn){
  const t = await tokens();
  const url = CFG.workerUrl+'/api/mitarbeiter-cockpit'+(zielUpn && zielUpn!==upn ? '?mitarbeiter='+encodeURIComponent(zielUpn) : '');
  const r = await fetch(url,{headers:{Authorization:'Bearer '+t.id,'X-Graph-Token':t.graph}});
  if(!r.ok){ let d=''; try{d=(await r.json()).error||''}catch(_){}; throw new Error('HTTP '+r.status+(d?' — '+d:'')); }
  const d = await r.json();
  const fls=d.fls||{}, u=d.urlaub||{}, k=d.krankheit||{}, kl=d.klienten||{};
  return {
    stand: d.stand || new Date().toISOString(),
    name: d.person?.name || null, team: d.person?.team || null, wochenstunden: d.person?.wochenstundenVertrag ?? null,
    faelle: kl.aktiv ?? null, faelleHb: kl.hb ?? null, faelleMb: kl.mb ?? null, faelleV: kl.v ?? null,
    flsIst: fls.istMonatsstunden ?? null, flsMonat: fls.istMonat || null, flsSoll64: fls.benchmark64 ?? null, flsSollWoche: fls.sollWochenstunden ?? null,
    urlaubRest: u.restTage ?? null, urlaubGenommen: u.genommenTage ?? null, urlaubGeplant: u.geplantTage ?? null,
    teamleitung: await holeTeamleitung(zielUpn),
    fortbildungTage: d.abwesenheitenVerfuegbar ? (k.fortbildungTage ?? null) : null,
    krankTage: d.abwesenheitenVerfuegbar ? (k.tage ?? null) : null, kindKrankTage: d.abwesenheitenVerfuegbar ? (k.kindKrankTage ?? null) : null, jahr: k.jahr || u.jahr || null,
    erweitert: await holeErweitert(zielUpn, t, d.person?.name),
    _mitarbeiterListe: d.sicht?.mitarbeiter || null
  };
}
/* Arbeitszeitkonto, Zeitanteile und Fahrzeug (privat/dienstlich) — eigener Worker-Endpunkt.
 * Fail-soft: fehlt etwas, bleibt dafür das manuelle Feld der Leitung. */
async function holeErweitert(zielUpn, t, personName){
  try{
    const url = CFG.workerUrl+'/api/og-kennzahlen'+(zielUpn && zielUpn!==upn ? '?mitarbeiter='+encodeURIComponent(zielUpn) : '');
    const r = await fetch(url,{headers:{Authorization:'Bearer '+t.id}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const e = await r.json();
    if(e.fahrzeug?.vorhanden) e.fahrzeug.stamm = await fuhrparkStamm(e.fahrzeug.carName, personName);
    return e;
  }catch(e){ console.warn('Erweiterte Kennzahlen nicht verfügbar —', e.message); return null; }
}
let FUHRPARK=null;
async function fuhrparkStamm(carName, personName){
  try{
    FUHRPARK = FUHRPARK || await (await fetch('data/fahrzeuge.json',{cache:'no-cache'})).json();
    const nr = s => (String(s||'').match(/(\d{3})\s*E?\b/)||[])[1];
    const n = nr(carName);
    /* Die API liefert am Leistungsnachweis nur die Fahrzeug-ID, keinen Namen → Zuordnung über den Nachnamen aus der KFZ-Übersicht */
    const nach=(personName||'').split(',')[0].trim().toLowerCase();
    const perName = nach ? FUHRPARK.filter(f=>f.status==='aktiv' && (f.fahrer||'').toLowerCase()===nach) : [];
    if(perName.length===1) return perName[0];
    return (n && FUHRPARK.find(f=>f.status==='aktiv' && nr(f.kennzeichen)===n)) || null;
  }catch(e){ return null; }
}
const km = n => n==null ? '—' : Number(n).toLocaleString('de-DE')+' km';
const std = n => n==null ? '—' : (n>0?'+':'')+String(n).replace('.',',')+' h';
function erweitertZeilen(k, freigabe){
  const e=k?.erweitert, out=[], da={};
  if(!e) return {zeilen:out, da};
  const z=e.zeitkonto;
  if(z?.vorhanden){
    const tag = new Date(freigabe||k.stand||Date.now()).toLocaleDateString('de-DE');
    da.zeitkonto=true; out.push([`Arbeitszeitkonto: Saldo zum ${tag}`, z.konten.map(x=>(z.konten.length>1?x.typ+': ':'')+(x.stunden===0?'0 h':std(x.stunden))).join(' · '), freigabe?'Stand bei Abgabe des Bogens':'wird bei der Abgabe des Bogens aktualisiert']);
  } else if(z?.grund){ da.zeitkonto=true; out.push(['Arbeitszeitkonto','—',z.grund]); }
  const a=e.anteil;
  if(a?.vorhanden){
    da.overhead=true;
    const mon=d=>new Date(d).toLocaleDateString('de-DE',{month:'short',year:'2-digit'});
    const teile=[['Klientenzeit'+(a.stationaerPct?' ambulant':''),a.klientPct],['Nordstern / stationär',a.stationaerPct],['Fahrt',a.fahrtPct],['Doku',a.dokuPct],['medial',a.medialPct],['Team & intern',a.internPct]]
      .filter(([,p])=>p).map(([n,p])=>`${n} ${p} %`).join(' · ');
    out.push([`Zeitanteile ${mon(a.von)} – ${mon(a.bis)} (${String(a.gesamtStd).replace('.',',')} h erfasst)`, teile,
      a.dienstplanEinbezogen?'':'ohne Dienstplan-Zeiten (Team, Nordstern)']);
  } else if(a?.grund){ da.overhead=true; out.push(['Zeitanteile (letzte 3 Monate)','—','noch '+a.grund]); }
  const f=e.fahrzeug;
  if(f?.vorhanden){
    da.kfz=true;
    const st=f.stamm, name=st?`${st.kennzeichen} (${st.fahrzeug})`:(f.carName||'Fahrzeug');
    out.push([`${name}: dienstlich laut Fahrtenbuch / privat`,
      `${km(f.dienstlichKm+(f.dienstlichAndereKm||0))} / ${km(f.privatKm)}${f.privatAnteil!=null?` = ${f.privatAnteil} % privat`:''}`,
      [`seit Übernahme am ${new Date(f.uebernahmeDatum).toLocaleDateString('de-DE')}`, ...(f.hinweise||[])].join(' · ')]);
    if(st && /leasing|finanz/i.test(st.finanzierung||'') && st.ez){
      const proJahr = st.kmProJahr || (st.kmVertrag&&st.laufzeitMonate ? st.kmVertrag/(st.laufzeitMonate/12) : null);
      if(proJahr){
        const jahre=(Date.now()-new Date(st.ez))/31557600000, soll=Math.round(proJahr*jahre/100)*100, ist=f.letzterKm ?? st.kmStand, diff=ist-soll;
        out.push([`Vertragliche Laufleistung (${Number(proJahr).toLocaleString('de-DE')} km/Jahr${st.rueckgabe?', Rückgabe '+new Date(st.rueckgabe).toLocaleDateString('de-DE'):''})`,
          `Soll bis heute ca. ${km(soll)} · Ist ${km(ist)} (${diff>0?'+':''}${Number(diff).toLocaleString('de-DE')} km)`, '']);
      }
    }
  }
  else if(f?.grund){ da.kfz=true; out.push(['Dienstfahrzeug','—',f.grund]); }
  return {zeilen:out, da};
}
function kennzahlenZeilen(k){
  if(!k) return [];
  const mon = k.flsMonat ? new Date(k.flsMonat+'-01').toLocaleDateString('de-DE',{month:'long',year:'numeric'}) : 'Vormonat';
  return [
    ['Aktive Fälle (HB / MB / Vertretung)', k.faelle==null?'—':`${k.faelle} (${num(k.faelleHb)} / ${num(k.faelleMb)} / ${num(k.faelleV)})`],
    [`Abrechenbare Stunden ${mon} (Ist / Soll 64 %)`, `${num(k.flsIst,' h')} / ${num(k.flsSoll64,' h')}`],
    ['Vertragliche Wochenstunden', num(k.wochenstunden,' h')],
    [`Urlaub ${k.jahr||''}: genommen / verplant / offen`, `${num(k.urlaubGenommen)} / ${num(k.urlaubGeplant)} / ${num(k.urlaubRest)} Tage`],
    [`Abwesenheitstage ${k.jahr||''}: Krankheit / Weiterbildung`, k.krankTage==null?'—':`${num(k.krankTage)} / ${num(k.fortbildungTage)} Tage`, k.kindKrankTage?`zusätzlich Kind krank: ${num(k.kindKrankTage)} Tage`:''],
  ];
}
/* Name der Teamleitung für „Wochenstunden / Team": bei Teamleitungen das eigene Team, sonst Vorgesetzte:r aus Entra */
function teamName(){
  const k=akt.kennzahlen||{};
  if(akt.f.Version==='A') return (akt.f.MitarbeiterName||'').split(',').reverse().join(' ').trim();
  if(k.teamleitung?.name) return GF.includes(k.teamleitung.mail) ? 'Geschäftsführung' : k.teamleitung.name;

function leserText(){

/* ═══════════════════════════════════════════════════════════
 * MITARBEITER-SICHT
 * ═══════════════════════════════════════════════════════════ */
function entpacke(i){
  const j = s => { try{ return s ? JSON.parse(s) : null }catch(e){ return null } };
  return { spId:i.spId, f:i.f, antworten:{skala:{},themen:[],text:{},kommentar:{},...(j(i.f.AntwortenJSON)||{})}, kennzahlen:j(i.f.KennzahlenJSON), leitung:j(i.f.LeitungJSON)||{manuell:{},vereinbarungen:[],naechster:''} };
}
async function oeffneEigenen(){
  const runde=P.get('r'), v=P.get('v');
  let i = items.find(x => (x.f.MitarbeiterUpn||'').toLowerCase()===upn && x.f.Runde===runde);
  if(!i){
    lade('Dein Bogen wird angelegt und mit deinen Kennzahlen aus Kilanka vorbefüllt …');
    let k=null; try{ k=await holeKennzahlen(); delete k._mitarbeiterListe; }catch(e){ console.warn('Kennzahlen nicht verfügbar —',e.message); }
    const name = k?.name || currentAccount.name || upn;
    const fields = { Title:`${name} – ${runde}`, MitarbeiterUpn:upn, MitarbeiterName:name, Runde:runde, Version:v, OGStatus:'Entwurf', Termin:P.get('t')||'',
      AntwortenJSON:JSON.stringify({skala:{},themen:[],text:{}}), KennzahlenJSON:k?JSON.stringify(k):'', LeitungJSON:'' };
    try{ const neu = await graph(LISTE()+'/items',{method:'POST',body:JSON.stringify({fields})}); i={spId:neu.id,f:{...fields}}; items.push(i); }
    catch(e){ return meldung('err','Dein Bogen konnte nicht angelegt werden: '+esc(e.message)); }
  }
  akt = entpacke(i); gfSicht=false;
  leseModus = ['Abgegeben','Abgeschlossen'].includes(akt.f.OGStatus);
  if(!leseModus && (!akt.kennzahlen?.erweitert || akt.kennzahlen.teamleitung===undefined)){
    try{
      lade('Kennzahlen werden aktualisiert …');
      const k=await holeKennzahlen(); delete k._mitarbeiterListe; akt.kennzahlen=k;
      await graph(`${LISTE()}/items/${akt.spId}/fields`,{method:'PATCH',body:JSON.stringify({KennzahlenJSON:JSON.stringify(k)})});
    }catch(e){ console.warn('Kennzahlen-Aktualisierung übersprungen —',e.message); }
  }
  renderBogen();
}

/* ═══════════════════════════════════════════════════════════
 * BOGEN RENDERN (beide Sichten)
 * ═══════════════════════════════════════════════════════════ */
function renderBogen(){
  const V = VERSIONEN[akt.f.Version] || VERSIONEN.B, a=akt.antworten, L=akt.leitung;
  const roMA = leseModus || gfSicht;         // Teil 1–3: nur Mitarbeiter:in, solange nicht abgegeben
  const roGF = !gfSicht || akt.f.OGStatus==='Abgeschlossen';   // Teil 4 (manuell) + 5: nur GF
  const termin = akt.f.Termin ? fmtDT(akt.f.Termin) : '—';
  const mehrere = V.sektionen.length>1;
  const skala = V.sektionen.map(([titel,items])=>(mehrere?`<tr class="sektion"><td colspan="8">${esc(titel)}</td></tr>`:'')+items.map(([id,txt])=>`<tr><td>${esc(txt)}</td>${[...SKALA,'ka'].map(w=>
    `<td><input type="radio" name="s_${id}" value="${w}" ${String(a.skala[id]??'')===String(w)?'checked':''} ${roMA?'disabled':''} onchange="setSkala('${id}',this.value)" aria-label="${w==='ka'?'keine Angabe':w}"></td>`).join('')}
    <td class="kom"><input type="text" ${roMA?'readonly':''} value="${esc(a.kommentar?.[id]||'')}" oninput="setKommentar('${id}',this.value)" aria-label="Kommentar"></td></tr>`).join('')).join('');
  const skalaKopf = mehrere ? 'Aussage' : V.sektionen[0][0];
  const themen = V.themen.map(t=>`<label><input type="checkbox" value="${esc(t)}" ${a.themen.includes(t)?'checked':''} ${roMA?'disabled':''} onchange="setThema(this)">${esc(t)}</label>`).join('');
  const fragen = V.fragen.map(([id,q])=>`<div class="frage-block"><div class="frage">${esc(q)}</div><textarea ${roMA?'readonly':''} oninput="setText('${id}',this.value)">${esc(a.text[id]||'')}</textarea></div>`).join('');
  const erw = erweitertZeilen(akt.kennzahlen, akt.f.AbgegebenAm);
  const kz = [...kennzahlenZeilen(akt.kennzahlen), ...erw.zeilen].map(([l,w,h])=>`<tr><td>${esc(l)}${h?`<br><span class="quelle" style="text-transform:none;letter-spacing:0">${esc(h)}</span>`:''}</td><td><b>${esc(w)}</b></td></tr>`).join('');
  /* Manuelle Zeile entfällt für Mitarbeitende, sobald der Wert automatisch vorliegt; die Leitung behält das Feld als Anmerkung/Korrektur. */
  const man = V.manuell.filter(([id])=> gfSicht || !erw.da[id] || (L.manuell?.[id])).map(([id,l])=>`<tr><td>${esc(l)}</td><td><input type="text" ${roGF?'readonly':''} value="${esc(L.manuell?.[id]||'')}" placeholder="${roGF?'🔒 wird von der Leitung ergänzt':(erw.da[id]?'optional: Anmerkung / Korrektur':'eintragen …')}" oninput="setManuell('${id}',this.value)"></td></tr>`).join('');
  const ver = [0,1,2,3].map(n=>{ const z=L.vereinbarungen?.[n]||{}; return `<tr>${['was','wer','bis'].map(k=>`<td><input type="text" ${roGF?'readonly':''} value="${esc(z[k]||'')}" oninput="setVer(${n},'${k}',this.value)"></td>`).join('')}</tr>`; }).join('');

  /* Teil 5: Mitarbeiter:in schlägt vor (eigenes Feld), die Leitung hält im Gespräch die Vereinbarungen fest.
   * In der Mitarbeiter-Sicht gibt es bewusst KEINE leeren, gesperrten Eingabefelder — das wirkte wie ein Fehler. */
  const hatVer = (L.vereinbarungen||[]).some(z=>z&&(z.was||z.wer||z.bis)) || !!L.naechster;
  const verTabelle = `<table class="daten"><tr><th style="width:62%">Was nehmen wir uns vor?</th><th>Wer</th><th>Bis wann</th></tr>${ver}</table>
    <div class="frage">Zwischencheck / nächstes Gespräch am:</div>
    <input type="text" ${roGF?'readonly':''} value="${esc(L.naechster||'')}" oninput="akt.leitung.naechster=this.value;geaendert()" style="max-width:280px">`;
  const vorschlag = a.text.ziele||'';
  const teil5 = gfSicht
    ? `<div class="teil-hinweis">Im Gespräch gemeinsam ausfüllen. Auch die Leitung trägt hier ein, was sie zusagt.</div>
       ${vorschlag?`<div class="frage">Vorschläge von ${esc((akt.f.MitarbeiterName||'').split(',').reverse().join(' ').trim())}:</div><textarea readonly>${esc(vorschlag)}</textarea><div style="height:12px"></div>`:''}

async function speichern(manuell, extra={}){
  clearTimeout(saveTimer);
  const s=document.getElementById('saveStand');
  /* Jede Sicht schreibt NUR ihre eigenen Felder — so überschreiben sich Mitarbeiter:in und Leitung nie gegenseitig. */
  const fields = gfSicht ? { LeitungJSON:JSON.stringify(akt.leitung), KennzahlenJSON:akt.kennzahlen?JSON.stringify(akt.kennzahlen):'', ...extra }
                         : { AntwortenJSON:JSON.stringify(akt.antworten), ...extra };
  try{
    if(s) s.textContent='Speichert …';
    await graph(`${LISTE()}/items/${akt.spId}/fields`,{method:'PATCH',body:JSON.stringify(fields)});
    Object.assign(akt.f,fields); dirty=false;
    if(s) s.textContent='Gespeichert um '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr';
    return true;
  }catch(e){
    if(s) s.textContent='⚠ Speichern fehlgeschlagen';
    if(manuell) alert('Speichern fehlgeschlagen: '+e.message+'\n\nDeine Eingaben bleiben im Fenster erhalten – bitte gleich noch einmal versuchen.');
    return false;
  }
}
async function abgeben(){
  const V=VERSIONEN[akt.f.Version], offen=alleItems(V).filter(([id])=>akt.antworten.skala[id]==null).length, t=teamleitungFuerHinweis();
  let frage='Bogen jetzt final abgeben? Danach kannst du ihn nicht mehr ändern.\n\n'+leserText()+(t?'\nDeine Teamleitung erhält ihn per E-Mail aus deinem Postfach.':'');
  if(offen) frage=`In Teil 1 sind noch ${offen} Zeile(n) ohne Angabe.\n\n`+frage;
  if(!akt.antworten.themen.length) frage='Du hast in Teil 2 noch kein Thema gewählt.\n\n'+frage;
  if(!confirm(frage)) return;

  const extra={OGStatus:'Abgegeben',AbgegebenAm:new Date().toISOString()};

async function sendeAnTeamleitung(t){
  const req={scopes:['Mail.Send'],account:currentAccount};
  const tok=(await msalInstance.acquireTokenSilent(req).catch(()=>msalInstance.acquireTokenPopup(req))).accessToken;
  const name=(akt.f.MitarbeiterName||'').split(',').reverse().join(' ').trim();
  const r=await fetch('https://graph.microsoft.com/v1.0/me/sendMail',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
    body:JSON.stringify({message:{subject:`Orientierungsgespräch ${akt.f.Runde} – Vorbereitungsbogen ${name}`,body:{contentType:'HTML',content:bogenAlsHtml()},
      toRecipients:[{emailAddress:{address:t.mail}}], ccRecipients:GF.map(g=>({emailAddress:{address:g}}))},saveToSentItems:true})});
  if(!r.ok) throw new Error('HTTP '+r.status);
}

      <div class="teil-hinweis" style="margin-top:8px">Nur für die Geschäftsführung sichtbar. Dieselben Werte erscheinen in Teil 4, sobald die Person ihren Bogen öffnet.</div></div>`;
  }catch(e){
    dlg.innerHTML = kopf('Kennzahlen aus Kilanka')+`<div class="kz-body"><div class="msg err" style="margin:0">Kennzahlen konnten nicht geladen werden: ${esc(e.message)}</div></div>`;
  }
}
async function setPlan(u,k,w){
  (plan[u] ||= {})[k]=w;
  const runde=aktRunde(), body={AntwortenJSON:JSON.stringify(plan)};
  try{
    if(planItem) await graph(`${LISTE()}/items/${planItem.spId}/fields`,{method:'PATCH',body:JSON.stringify(body)});
    else { const neu=await graph(LISTE()+'/items',{method:'POST',body:JSON.stringify({fields:{Title:'Planung '+runde,MitarbeiterUpn:planKey(runde),Runde:runde,...body}})}); planItem={spId:neu.id,f:{MitarbeiterUpn:planKey(runde),Runde:runde,...body}}; items.push(planItem); }
  }catch(e){ const m=document.getElementById('adminMsg'); m.className='msg err'; m.textContent='Planung konnte nicht gespeichert werden: '+e.message; }
}
async function kopiere(u){
  const m=mitarbeiter.find(x=>x.upn===u); await navigator.clipboard.writeText(linkFuer(m,aktRunde()));
  const el=document.getElementById('adminMsg'); el.className='msg ok'; el.textContent='Link für '+m.name+' kopiert.';
}
function mail(u){
  const m=mitarbeiter.find(x=>x.upn===u), p=plan[u]||{}, vor=(m.name.split(',')[1]||m.name).trim().split(' ')[0];
  const termin=p.t?' am '+fmtDT(p.t):'';
  const text=`Hallo ${vor},\n\nunser Orientierungsgespräch steht an${termin}. Zur Vorbereitung haben wir einen kurzen Online-Bogen für dich (ca. 10 Minuten):\n\n${linkFuer(m,aktRunde())}\n\nDu meldest dich mit deinem Praxis-NeueWege-Konto an. Du kannst jederzeit zwischenspeichern und später weitermachen – bitte gib den Bogen spätestens zwei Tage vor dem Gespräch final ab. Wer lieber auf Papier schreibt: Im Bogen gibt es unten „Auf Papier ausfüllen“ – dann bitte ebenfalls spätestens zwei Tage vorher bei uns abgeben. Den Bogen bekommen wir beide und deine Teamleitung als Vorbereitung auf das Gespräch.\n\nWir freuen uns auf das Gespräch!\nSonja & Markus`;
  location.href=`mailto:${encodeURIComponent(u)}?subject=${encodeURIComponent('Dein Orientierungsgespräch – Vorbereitungsbogen')}&body=${encodeURIComponent(text)}`;
}

function zeigeSetup(){
  app().innerHTML=`<div class="card"><h2 class="teil" style="margin-top:0">Einrichtung der zentralen Ablage</h2>
    <p style="margin:8px 0 14px">Die SharePoint-Liste <b>${esc(CFG.listName)}</b> existiert noch nicht. Sie wird jetzt mit allen Spalten und einem Prüf-Element angelegt.</p>
    <button class="btn btn-primary" onclick="setup()">Liste anlegen</button><div class="msg" id="setupMsg"></div></div>`;
}
async function setup(){
  const m=document.getElementById('setupMsg');
  try{
    m.className='msg warn'; m.textContent='Berechtigung anfordern …';
    const req={scopes:['Sites.Manage.All'],account:currentAccount};
    const t=(await msalInstance.acquireTokenSilent(req).catch(()=>msalInstance.acquireTokenPopup(req))).accessToken;
    m.textContent='Liste wird angelegt …';
    const r=await fetch(`https://graph.microsoft.com/v1.0/sites/${CFG.spHost}/lists`,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},
      body:JSON.stringify({displayName:CFG.listName,columns:SPALTEN,list:{template:'genericList'}})});
    if(!r.ok) throw new Error(r.status+': '+(await r.text()).slice(0,300));
    await graph(LISTE()+'/items',{method:'POST',body:JSON.stringify({fields:{Title:'Sicherheitsprüfung – nicht löschen',MitarbeiterUpn:SENTINEL,OGStatus:'System'}})});
    m.className='msg ok';
    m.innerHTML=`<b>Liste angelegt.</b> Jetzt bitte <u>einmalig in SharePoint</u> absichern – ohne diese Schritte sperrt die App das Ausfüllen:<br><br>
      1. Liste öffnen → ⚙ → Listeneinstellungen → <b>Erweiterte Einstellungen</b> → „Berechtigungen auf Elementebene“: Lesezugriff <b>„Elemente, die vom Benutzer erstellt wurden“</b>, Erstell-/Bearbeitungszugriff <b>„Eigene Elemente erstellen und bearbeiten“</b>.<br>
      2. Listeneinstellungen → <b>Berechtigungen für diese Liste</b> → Vererbung beenden → Mitglieder und Besucher auf <b>„Mitwirken“</b> setzen (nicht „Bearbeiten“ – das enthält „Listen verwalten“ und hebelt Schritt 1 aus). Vollzugriff nur Sonja und Markus.<br>
      3. Mit einem Test-Mitarbeiterkonto einen Link öffnen: Erscheint der Bogen, ist alles richtig. Erscheint „Sicherheitsprüfung fehlgeschlagen“, stimmt Schritt 1 oder 2 noch nicht.<br><br>
      <button class="btn btn-primary btn-sm" onclick="location.reload()">Zur Übersicht</button>`;
  }catch(e){ m.className='msg err'; m.textContent='Einrichtung fehlgeschlagen: '+e.message; }
}
</script>
