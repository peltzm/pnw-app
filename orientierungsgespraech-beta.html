<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orientierungsgespräch · Praxis NeueWege</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<!-- MSAL-Regel: immer 2.38.0 von alcdn (2.38.3 existiert dort nicht) -->
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<style>
/* CI-Tokens: App-Shell wie die übrigen PNW-Apps, Bogen wie das PDF-Layout des Berichtsgenerators */
:root{
  --bg:#f7f6f2;--surface:#fff;--border:#e2dfd8;--border-strong:#c8c4bc;
  --text:#1a1916;--text-muted:#6b6860;--text-hint:#a09e99;
  --accent:#7b3f1e;--accent-light:#f5ede7;--accent-mid:#c47848;
  --ok:#2d6a4f;--ok-bg:#eaf4ee;--warn:#b45309;--warn-bg:#fef7ec;--error:#9b1c1c;--error-bg:#fef2f2;
  --dunkelbraun:#5A2D15;--terra:#A15F38;--creme:#F5F0EA;--ink:#211F1B;--meta:#8A857B;--r1:#D8D2C6;--r2:#E4DED2;
  --radius:8px;--radius-lg:12px;--hdr-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100dvh}
body{font-family:'Kodchasan','Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:var(--hdr-h);position:sticky;top:0;z-index:100}
.header-brand{display:flex;align-items:center;gap:10px}
.header-brand img{height:28px;width:auto}
.header-brand span{font-size:13px;font-weight:600}
.header-right{display:flex;align-items:center;gap:8px}
.user-badge{display:none;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.user-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-mid)}
.beta-badge{font-size:10px;font-weight:700;color:#fff;background:var(--accent-mid);border-radius:4px;padding:1px 7px;letter-spacing:.4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;min-height:36px;transition:all .12s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#68351a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--border-strong);color:var(--text)}
.btn-danger{background:transparent;color:var(--error);border:1px solid #e9b4b4}.btn-danger:hover{background:var(--error-bg)}
.btn-sm{padding:5px 12px;min-height:30px;font-size:12px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 120px}
.wrap.wide{max-width:1180px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:16px}
.login{max-width:440px;margin:12vh auto 0;text-align:center}
.login img{height:60px;margin-bottom:18px}
.login h1{font-family:'Libre Baskerville',serif;font-size:22px;color:var(--dunkelbraun);margin-bottom:6px}
.login p{color:var(--text-muted);font-size:13px;margin-bottom:18px}
.msg{display:none;border-radius:var(--radius);padding:10px 14px;font-size:13px;margin:12px 0;text-align:left}
.msg.err{display:block;background:var(--error-bg);color:var(--error);border:1px solid #fca5a5}
.msg.warn{display:block;background:var(--warn-bg);color:var(--warn);border:1px solid #fcd34d}
.msg.ok{display:block;background:var(--ok-bg);color:var(--ok);border:1px solid #a7d7bd}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Bogen (CI Berichtsgenerator-PDF) ── */
.bogen-kopf{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--r1);margin-bottom:14px}
.bogen-kopf h1{font-family:'Libre Baskerville',serif;font-weight:700;font-size:26px;color:var(--dunkelbraun);line-height:1.2}
.bogen-kopf .unter{font-family:'Libre Baskerville',serif;font-style:italic;font-size:13.5px;color:var(--terra);margin:3px 0 5px}
.eyebrow{font-size:9.5px;font-weight:600;letter-spacing:1.1px;color:var(--meta);text-transform:uppercase}
.bogen-kopf img{height:54px;width:auto}
.stamm{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 24px;margin-bottom:14px}
.stamm div b{display:block;font-weight:500;font-size:13.5px;color:var(--ink)}
.hinweis{background:var(--creme);border-left:3px solid var(--terra);padding:9px 14px;font-size:12.5px;border-radius:0 6px 6px 0;margin-bottom:6px}
.hinweis b{color:var(--accent)}
h2.teil{font-family:'Libre Baskerville',serif;font-size:15px;color:var(--dunkelbraun);border-bottom:1px solid var(--dunkelbraun);padding-bottom:4px;margin:26px 0 6px}
h2.teil span{color:var(--terra)}
.teil-hinweis{font-size:11.5px;font-style:italic;color:var(--meta);margin-bottom:10px}
table.skala{width:100%;border-collapse:collapse;font-size:13px}
table.skala th{background:var(--creme);font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink);padding:7px 4px;border:1px solid var(--r2)}
table.skala th:first-child{text-align:left;padding-left:10px}
table.skala td{border:1px solid var(--r2);padding:6px 4px;text-align:center}
table.skala td:first-child{text-align:left;padding-left:10px}
table.skala tr:nth-child(odd) td{background:#FBF8F4}
table.skala input[type=radio]{accent-color:var(--accent);width:17px;height:17px;cursor:pointer}
table.skala td.kom{padding:3px 6px;min-width:190px}
table.skala td.kom input{width:100%;border:none;border-bottom:1px solid var(--r1);border-radius:0;background:transparent;padding:4px 2px;font-size:12.5px}
table.skala tr.sektion td{background:var(--creme)!important;text-align:left;font-family:'Libre Baskerville',serif;font-weight:700;font-size:12.5px;color:var(--dunkelbraun);padding:8px 10px}
.papier-hinweis{display:none;border:1.5pt solid var(--terra);border-radius:6px;padding:9px 14px;font-size:12.5px;margin-bottom:10px}
.themen{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 18px}
.themen label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.themen input{accent-color:var(--accent);width:16px;height:16px}
.frage{margin:14px 0 4px;font-size:13.5px}
textarea,input[type=text],input[type=datetime-local],input[type=month],select{width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);border:1px solid var(--r1);border-radius:6px;padding:8px 10px;background:#fff}
textarea{min-height:74px;resize:vertical;line-height:1.5}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent-light);border-color:var(--accent-mid)}
textarea[readonly],input[readonly]{background:#FBF8F4;color:var(--text-muted)}
table.daten{width:100%;border-collapse:collapse;font-size:13px}
table.daten th{background:var(--creme);font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;text-align:left;padding:7px 10px;border:1px solid var(--r2)}
table.daten td{border:1px solid var(--r2);padding:6px 10px;vertical-align:middle}
table.daten tr:nth-child(odd) td{background:#FBF8F4}
table.daten td input{border:none;background:transparent;padding:4px 2px}
.gesperrt{background:var(--creme);border:1px dashed var(--r1);border-radius:6px;padding:12px 14px;font-size:12.5px;color:var(--text-muted)}
.nur-druck{display:none}
.quelle{font-size:10px;color:var(--meta);letter-spacing:.4px;text-transform:uppercase}
.bogen-fuss{border-top:1.5px solid var(--terra);margin-top:28px;padding-top:8px;font-size:10.5px;color:var(--meta)}
.leiste{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:flex-end;z-index:90;flex-wrap:wrap}
.leiste .stand{margin-right:auto;font-size:12px;color:var(--text-muted)}
.status{display:inline-block;font-size:11px;font-weight:600;border-radius:10px;padding:2px 10px}
.status.offen{background:#eee;color:#666}.status.entwurf{background:var(--warn-bg);color:var(--warn)}
.status.papier{background:#eef4fb;color:#1565c0}
.status.abgegeben{background:var(--ok-bg);color:var(--ok)}.status.abgeschlossen{background:var(--accent-light);color:var(--accent)}
table.admin{width:100%;border-collapse:collapse;font-size:13px}
table.admin th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);padding:8px;border-bottom:1px solid var(--border-strong)}
table.admin td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
table.admin select,table.admin input{padding:5px 8px;font-size:12.5px}
.adminbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.adminbar label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:3px}
dialog.kz{border:1px solid var(--border);border-radius:var(--radius-lg);padding:0;max-width:860px;width:calc(100% - 32px);box-shadow:0 12px 40px rgba(0,0,0,.18)}
dialog.kz::backdrop{background:rgba(33,31,27,.45)}
dialog.kz .kz-kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 10px;border-bottom:1px solid var(--r1)}
dialog.kz .kz-kopf h3{font-family:'Libre Baskerville',serif;font-size:17px;color:var(--dunkelbraun)}
dialog.kz .kz-body{padding:14px 22px 20px;max-height:70vh;overflow:auto}
table.skala.mitfremd tr:nth-child(odd) td{background:transparent}
table.skala.mitfremd tr.fremd td{background:var(--accent-light);border-top:none;padding-top:4px;padding-bottom:4px}
table.skala.mitfremd tr.fremd.abw td{background:var(--warn-bg)}
table.skala tr.fremd td:first-child{font-size:12px;color:var(--accent);padding-left:22px}
table.skala tr.fremd td.kom{font-size:12.5px;color:var(--accent);text-align:left}
.pkt,table.skala tr.fremd td{-webkit-print-color-adjust:exact;print-color-adjust:exact}   /* Punkte und Hinterlegung auch im Ausdruck */
.pkt{display:inline-block;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--r1);background:#fff;vertical-align:middle}
.pkt.an{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 45%,#fff 50%)}
.pkt.selbst.an{border-color:var(--ink);background:radial-gradient(circle,var(--ink) 0 45%,#fff 50%)}
.tl-wert{display:block;margin-top:4px;font-size:12px;color:var(--accent);background:var(--accent-light);border-radius:6px;padding:3px 8px;font-weight:400}
.tl-wert.abw{background:var(--warn-bg);color:var(--warn);border:1px solid #fcd34d}
.skala-legende{font-size:11.5px;color:var(--meta);margin:2px 0 8px}
.skala-wrap{overflow-x:auto}
.mehr-btn{display:none}
/* ── Smartphone im Hochformat (z. B. Samsung S24, 360 px): Karten statt Tabellen, große Tippflächen ── */
@media (max-width:700px){
  body{font-size:15px}
  .header{padding:0 10px}.header-brand{gap:7px;min-width:0}.header-brand img{height:24px}.header-brand span:not(.beta-badge){font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-badge{display:none!important}.header-right .btn{padding:4px 9px;min-height:28px;font-size:11.5px}
  .wrap{padding:10px 8px 150px}.card{padding:16px 14px;border-radius:10px}
  .bogen-kopf{flex-direction:column-reverse;align-items:flex-start;gap:10px}.bogen-kopf h1{font-size:22px}.bogen-kopf img{height:36px}
  .stamm{grid-template-columns:1fr 1fr;gap:10px 14px}
  .hinweis{font-size:13px;padding:10px 12px}
  h2.teil{font-size:15.5px;margin-top:24px}
  textarea,input[type=text],input[type=datetime-local],select{font-size:16px}   /* ≥16 px: kein Auto-Zoom beim Antippen */
  textarea{min-height:110px}
  /* Teil 1: je Aussage eine Karte — Text, darunter 6 Tippflächen, darunter Kommentar */
  .skala-wrap{overflow:visible}
  table.skala,table.skala tbody{display:block;width:100%}
  table.skala tr:first-child{display:none}
  table.skala tr{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:14px 0 12px;border-bottom:1px solid var(--r2)}
  table.skala tr td{background:transparent!important;border:none;padding:0}
  table.skala tr td:first-child{grid-column:1/-1;text-align:left;padding:0 0 4px;font-size:15px;line-height:1.4;font-weight:500}
  table.skala td.r label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border:1px solid var(--r1);border-radius:10px;background:#fff;cursor:pointer}
  table.skala td.r label::before{content:attr(data-l);font-size:12px;font-weight:600;color:var(--text-muted)}
  table.skala td.r label:has(input:checked),table.skala td.r label.gewaehlt{border-color:var(--accent);background:var(--accent-light)}
  table.skala td.r label:has(input:checked)::before{color:var(--accent)}
  table.skala input[type=radio]{width:20px;height:20px}
  table.skala td.kom{grid-column:1/-1;min-width:0;padding-top:2px}
  table.skala td.kom input{font-size:15px;padding:8px 2px}
  table.skala tr.fremd{padding:8px 10px;margin-top:-6px;border-radius:0 0 10px 10px;background:var(--accent-light)}
  table.skala tr.fremd.abw{background:var(--warn-bg)}
  table.skala tr.fremd td.r{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text-muted)}
  table.skala tr.fremd td.r::before{content:attr(data-l)}
  table.skala tr.sektion{display:block;padding:0;border:none;margin-top:14px}
  table.skala tr.sektion td{display:block;background:var(--creme)!important;padding:9px 12px;border-radius:8px;font-size:14px}
  /* Teil 2: eine Spalte, große Tippflächen */
  .themen{grid-template-columns:1fr;gap:0}
  .themen label{padding:11px 2px;border-bottom:1px solid var(--r2);font-size:15px}
  .themen input{width:20px;height:20px}
  /* Teil 4/5: Zeilen stapeln (Bezeichnung klein, Wert darunter) */
  table.daten,table.daten tbody{display:block;width:100%}
  table.daten tr:first-child{display:none}
  table.daten tr{display:block;padding:10px 0;border-bottom:1px solid var(--r2)}
  table.daten td{display:block;border:none;background:transparent!important;padding:0;width:100%!important}
  table.daten td:first-child{font-size:12.5px;color:var(--text-muted);margin-bottom:2px}
  table.daten td b{font-size:15px;line-height:1.45}
  table.daten td input{border:1px solid var(--r1);border-radius:6px;background:#fff;padding:8px 10px;margin-top:4px}
  table.daten td input[readonly]{background:#FBF8F4}
  .bogen-fuss{font-size:10px}
  /* Leiste: zwei Hauptaktionen nebeneinander, Rest unter „Mehr" */
  .leiste{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:8px}
  .leiste .stand{flex-basis:100%;margin:0;font-size:11.5px;min-height:0}
  .leiste .stand:empty{display:none}
  .leiste .btn{flex:1 1 0;min-width:0;min-height:46px;padding:6px 6px;font-size:13.5px;line-height:1.2;white-space:normal}
  .leiste .mehr-btn{display:inline-flex;flex:0 0 auto}
  .leiste .sek{display:none;flex-basis:100%;order:-1}
  .leiste.offen .sek{display:inline-flex}
  /* GF-Übersicht: Tabellenzeilen als Karten */
  table.admin,table.admin tbody{display:block}table.admin tr:first-child{display:none}
  table.admin tr{display:block;padding:12px 0;border-bottom:1px solid var(--border)}
  table.admin td{display:block;border:none;padding:4px 0;white-space:normal!important}
  dialog.kz .kz-kopf{flex-direction:column}
}
.footer-note{text-align:center;font-size:11px;color:var(--text-hint);margin-top:18px}

/* ── Druck: DIN A4 ── */
@page{size:A4;margin:14mm 13mm}
@media print{
  body{background:#fff;font-size:10.5pt}
  .header,.leiste,.no-print,.footer-note{display:none!important}
  .wrap{max-width:none;padding:0}.card{border:none;padding:0;margin:0}
  textarea,input[type=text]{border:none;border-bottom:.5pt solid var(--r1);border-radius:0;padding:2pt 0;background:transparent!important;resize:none}
  h2.teil{break-after:avoid;margin-top:12pt}.hinweis,.papier-hinweis{font-size:8.6pt;padding:6pt 10pt}.bogen-kopf{padding-bottom:6pt;margin-bottom:8pt}.stamm{margin-bottom:8pt}.bogen-fuss{margin-top:14pt}.teil-hinweis{break-after:avoid}
  .frage-block,.themen,.stamm,.hinweis{break-inside:avoid}
  table.skala tr,table.daten tr{break-inside:avoid}table.skala td,table.skala th{padding:2.4pt 3pt}table.daten td input{padding:1pt 2pt}
  textarea{min-height:40pt;overflow:hidden!important;height:auto}table.daten td{padding:4pt 8pt}.frage{margin-top:9pt}
  .nur-druck{display:block}
  table.skala tr.fremd,.fremd-info{display:none!important}   /* TL-Einschätzung nie auf dem Ausdruck */
  .skala-legende{margin-bottom:4pt}input::placeholder{color:transparent}
  body.papier .papier-hinweis{display:block}body.papier .hinweis{display:none}
  table.skala td.kom{min-width:0;width:24%}table.skala th:first-child,table.skala td:first-child{width:48%}
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════

  if (exp < Date.now()+60000) r = await msalInstance.acquireTokenSilent({...req,forceRefresh:true});

let teamKartePromise=null, gruppenFehler=null;
async function gruppenToken(interaktiv){
  const req={scopes:['GroupMember.Read.All'],account:currentAccount};
  try{ return (await msalInstance.acquireTokenSilent(req)).accessToken; }
  catch(e){ if(!interaktiv) throw e; return (await msalInstance.acquireTokenPopup(req)).accessToken; }
}
function teamKarte(interaktiv){
  if(interaktiv) teamKartePromise=null;
  return teamKartePromise ||= (async()=>{
    try{
      const tok=await gruppenToken(interaktiv), karte={};   // upn → Team
      const hole=async url=>{ const r=await fetch(url,{headers:{Authorization:'Bearer '+tok,ConsistencyLevel:'eventual'}}); if(!r.ok) throw new Error('Graph '+r.status); return r.json(); };
      for(const t of TEAMS){
        const g=(await hole('https://graph.microsoft.com/v1.0/groups?$filter='+encodeURIComponent(`mail eq '${t.gruppe}'`)+'&$select=id,displayName')).value?.[0];
        if(!g){ console.warn('Entra-Gruppe nicht gefunden:',t.gruppe); continue; }
        t.mitglieder=[]; let url=`https://graph.microsoft.com/v1.0/groups/${g.id}/members/microsoft.graph.user?$select=displayName,userPrincipalName,mail&$top=200`;
        while(url){ const d=await hole(url); for(const u of d.value||[]){ const x=(u.userPrincipalName||u.mail||'').toLowerCase(); if(!x) continue; t.mitglieder.push({upn:x,name:u.displayName||x}); if(x!==t.tl) karte[x]=t; } url=d['@odata.nextLink']||null; }
      }
      gruppenFehler=null; return karte;
    }catch(e){ gruppenFehler=e.message; console.warn('Entra-Gruppen nicht lesbar —',e.message); return null; }
  })();
}

    flsIst: fls.istMonatsstunden ?? null, flsMonat: fls.istMonat || null, flsSoll64: fls.benchmark64 ?? null, flsSollWoche: fls.sollWochenstunden ?? null,
    urlaubRest: u.restTage ?? null, urlaubGenommen: u.genommenTage ?? null, urlaubGeplant: u.geplantTage ?? null,
    teamleitung: await holeTeamleitung(zielUpn),
    fortbildungTage: d.abwesenheitenVerfuegbar ? (k.fortbildungTage ?? null) : null,
    krankTage: d.abwesenheitenVerfuegbar ? (k.tage ?? null) : null, kindKrankTage: d.abwesenheitenVerfuegbar ? (k.kindKrankTage ?? null) : null, jahr: k.jahr || u.jahr || null,
    erweitert: await holeErweitert(zielUpn, t, d.person?.name),

/* Arbeitszeitkonto, Zeitanteile und Fahrzeug (privat/dienstlich) — eigener Worker-Endpunkt.
 * Fail-soft: fehlt etwas, bleibt dafür das manuelle Feld der Leitung. */
async function holeErweitert(zielUpn, t, personName){
  try{
    const url = CFG.workerUrl+'/api/og-kennzahlen'+(zielUpn && zielUpn!==upn ? '?mitarbeiter='+encodeURIComponent(zielUpn) : '');
    const r = await fetch(url,{headers:{Authorization:'Bearer '+t.id}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const e = await r.json();
    if(e.fahrzeug?.vorhanden) e.fahrzeug.stamm = await fuhrparkStamm(e.fahrzeug.carName, personName);
    return e;
  }catch(e){ console.warn('Erweiterte Kennzahlen nicht verfügbar —', e.message); return null; }
}
let FUHRPARK=null;
async function fuhrparkStamm(carName, personName){
  try{
    FUHRPARK = FUHRPARK || await (await fetch('data/fahrzeuge.json',{cache:'no-cache'})).json();
    const nr = s => (String(s||'').match(/(\d{3})\s*E?\b/)||[])[1];
    const n = nr(carName);
    /* Die API liefert am Leistungsnachweis nur die Fahrzeug-ID, keinen Namen → Zuordnung über den Nachnamen aus der KFZ-Übersicht */
    const nach=(personName||'').split(',')[0].trim().toLowerCase();
    const perName = nach ? FUHRPARK.filter(f=>f.status==='aktiv' && (f.fahrer||'').toLowerCase()===nach) : [];
    if(perName.length===1) return perName[0];
    return (n && FUHRPARK.find(f=>f.status==='aktiv' && nr(f.kennzeichen)===n)) || null;
  }catch(e){ return null; }
}
const km = n => n==null ? '—' : Number(n).toLocaleString('de-DE')+' km';
const std = n => n==null ? '—' : (n>0?'+':'')+String(n).replace('.',',')+' h';
function erweitertZeilen(k, freigabe){
  const e=k?.erweitert, out=[], da={};
  if(!e) return {zeilen:out, da};
  const z=e.zeitkonto;
  if(z?.vorhanden){
    const tag = new Date(freigabe||k.stand||Date.now()).toLocaleDateString('de-DE');
    /* Nur der Gesamtsaldo des Stundenkontos (= „Saldo" im Kilanka-Panel). Ältere Snapshots enthielten alle Konten → hier herausfiltern. */
    const sk = z.konten.find(x=>/stundenkonto/i.test(x.typ));
    const wert = sk ? (sk.stunden===0 ? '0,00 h' : (sk.stunden>0?'+':'−')+Math.abs(sk.stunden).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' h') : '—';
    da.zeitkonto=true; out.push([`Arbeitszeitkonto: Saldo zum ${tag}`, wert, freigabe?'Stand bei Abgabe des Bogens':'wird bei der Abgabe des Bogens aktualisiert']);
  } else if(z?.grund){ da.zeitkonto=true; out.push(['Arbeitszeitkonto','—',z.grund]); }
  const a=e.anteil;
  if(a?.vorhanden){
    da.overhead=true;
    const mon=d=>new Date(d).toLocaleDateString('de-DE',{month:'short',year:'2-digit'});
    const teile=[['Klientenzeit'+(a.stationaerPct?' ambulant':''),a.klientPct],['Nordstern / stationär',a.stationaerPct],['Fahrt',a.fahrtPct],['Doku',a.dokuPct],['medial',a.medialPct],['Team & intern',a.internPct]]
      .filter(([,p])=>p).map(([n,p])=>`${n} ${p} %`).join(' · ');
    out.push([`Zeitanteile ${mon(a.von)} – ${mon(a.bis)} (${String(a.gesamtStd).replace('.',',')} h erfasst)`, teile,
      a.dienstplanEinbezogen?'':'ohne Dienstplan-Zeiten (Team, Nordstern)']);
  } else if(a?.grund){ da.overhead=true; out.push(['Zeitanteile (letzte 3 Monate)','—','noch '+a.grund]); }
  const f=e.fahrzeug;
  if(f?.vorhanden){
    da.kfz=true;
    const st=f.stamm, name=st?`${st.kennzeichen} (${st.fahrzeug})`:(f.carName||'Fahrzeug');
    out.push([`${name}: dienstlich laut Fahrtenbuch / privat`,
      `${km(f.dienstlichKm+(f.dienstlichAndereKm||0))} / ${km(f.privatKm)}${f.privatAnteil!=null?` = ${f.privatAnteil} % privat`:''}`,
      [`seit Übernahme am ${new Date(f.uebernahmeDatum).toLocaleDateString('de-DE')}`, ...(f.hinweise||[])].join(' · ')]);
    if(st && /leasing|finanz/i.test(st.finanzierung||'') && st.ez){
      const proJahr = st.kmProJahr || (st.kmVertrag&&st.laufzeitMonate ? st.kmVertrag/(st.laufzeitMonate/12) : null);
      if(proJahr){
        const jahre=(Date.now()-new Date(st.ez))/31557600000, soll=Math.round(proJahr*jahre/100)*100, ist=f.letzterKm ?? st.kmStand, diff=ist-soll;
        out.push([`Vertragliche Laufleistung (${Number(proJahr).toLocaleString('de-DE')} km/Jahr${st.rueckgabe?', Rückgabe '+new Date(st.rueckgabe).toLocaleDateString('de-DE'):''})`,
          `Soll bis heute ca. ${km(soll)} · Ist ${km(ist)} (${diff>0?'+':''}${Number(diff).toLocaleString('de-DE')} km)`, '']);
      }
    }
  }
  else if(f?.grund){ da.kfz=true; out.push(['Dienstfahrzeug','—',f.grund]); }
  return {zeilen:out, da};
}
function kennzahlenZeilen(k){
  if(!k) return [];
  const mon = k.flsMonat ? new Date(k.flsMonat+'-01').toLocaleDateString('de-DE',{month:'long',year:'numeric'}) : 'Vormonat';
  return [
    ['Aktive Fälle (HB / MB / Vertretung)', k.faelle==null?'—':`${k.faelle} (${num(k.faelleHb)} / ${num(k.faelleMb)} / ${num(k.faelleV)})`],
    [`Abrechenbare Stunden ${mon} (Ist / Soll 64 %)`, `${num(k.flsIst,' h')} / ${num(k.flsSoll64,' h')}`],
    ['Vertragliche Wochenstunden', num(k.wochenstunden,' h')],
    [`Urlaub ${k.jahr||''}: genommen / verplant / offen`, `${num(k.urlaubGenommen)} / ${num(k.urlaubGeplant)} / ${num(k.urlaubRest)} Tage`],
    [`Abwesenheitstage ${k.jahr||''}: Krankheit / Weiterbildung`, k.krankTage==null?'—':`${num(k.krankTage)} / ${num(k.fortbildungTage)} Tage`, k.kindKrankTage?`zusätzlich Kind krank: ${num(k.kindKrankTage)} Tage`:''],
  ];
}
/* Name der Teamleitung für „Wochenstunden / Team": bei Teamleitungen das eigene Team, sonst Vorgesetzte:r aus Entra */

function entpacke(i){
  const j = s => { try{ return s ? JSON.parse(s) : null }catch(e){ return null } };
  return { spId:i.spId, f:i.f, antworten:{skala:{},themen:[],text:{},kommentar:{},...(j(i.f.AntwortenJSON)||{})}, kennzahlen:j(i.f.KennzahlenJSON), leitung:j(i.f.LeitungJSON)||{manuell:{},vereinbarungen:[],naechster:''} };
}
async function oeffneEigenen(){
  const runde=P.get('r'), v=P.get('v');
  let i = items.find(x => (x.f.MitarbeiterUpn||'').toLowerCase()===upn && x.f.Runde===runde);
  if(!i){
    lade('Dein Bogen wird angelegt und mit deinen Kennzahlen aus Kilanka vorbefüllt …');
    let k=null; try{ k=await holeKennzahlen(); delete k._mitarbeiterListe; }catch(e){ console.warn('Kennzahlen nicht verfügbar —',e.message); }
    const name = k?.name || currentAccount.name || upn;
    const fields = { Title:`${name} – ${runde}`, MitarbeiterUpn:upn, MitarbeiterName:name, Runde:runde, Version:v, OGStatus:'Entwurf', Termin:P.get('t')||'',
      AntwortenJSON:JSON.stringify({skala:{},themen:[],text:{}}), KennzahlenJSON:k?JSON.stringify(k):'', LeitungJSON:'' };
    try{ const neu = await graph(LISTE()+'/items',{method:'POST',body:JSON.stringify({fields})}); i={spId:neu.id,f:{...fields}}; items.push(i); }
    catch(e){ return meldung('err','Dein Bogen konnte nicht angelegt werden: '+esc(e.message)); }
  }
  akt = entpacke(i); gfSicht=false;
  leseModus = ['Abgegeben','Abgeschlossen'].includes(akt.f.OGStatus);
  if(!leseModus && (!akt.kennzahlen?.erweitert || !akt.kennzahlen.teamleitung || !akt.kennzahlen.teamleitung.quelle)){
    try{
      lade('Kennzahlen werden aktualisiert …');
      const k=await holeKennzahlen(); delete k._mitarbeiterListe; akt.kennzahlen=k;
      await graph(`${LISTE()}/items/${akt.spId}/fields`,{method:'PATCH',body:JSON.stringify({KennzahlenJSON:JSON.stringify(k)})});
    }catch(e){ console.warn('Kennzahlen-Aktualisierung übersprungen —',e.message); }
  }
  renderBogen();
}

    let tl='';
    if(fremd?.abgegeben){
      const w=fremd.skala[id], k=fremd.kommentar?.[id], e=a.skala[id];
      const abw = typeof w==='number' && typeof e==='number' && Math.abs(w-e)>=2;
      if(w!=null || k) tl=`<tr class="fremd${abw?' abw':''}"><td>${esc(fremd.tlName)}</td>${[...SKALA,'ka'].map(x=>
        `<td class="r" data-l="${x==='ka'?'k. A.':x}"><span class="pkt${String(w)===String(x)?' an':''}" title="${esc(fremd.tlName)}: ${x==='ka'?'k. A.':x}"></span></td>`).join('')}<td class="kom">${esc(k||'')}</td></tr>`;
    }
    return `<tr><td>${esc(txt)}</td>${[...SKALA,'ka'].map(w=>

       : `<td class="r"><label data-l="${w==='ka'?'k. A.':w}"><input type="radio" name="s_${id}" value="${w}" ${String(a.skala[id]??'')===String(w)?'checked':''} onchange="setSkala('${id}',this.value)" aria-label="${w==='ka'?'keine Angabe':w}"></label></td>`).join('')}
    <td class="kom"><input type="text" ${ro?'readonly':''} value="${esc(a.kommentar?.[id]||'')}" oninput="setKommentar('${id}',this.value)" aria-label="Kommentar" placeholder="${ro?'':'Kommentar (optional)'}"></td></tr>${tl}`;}).join('')).join('');
  const kopf = mehrere ? 'Aussage' : V.sektionen[0][0];
  const fremdInfo = fremd ? `<div class="teil-hinweis fremd-info">${fremd.abgegeben?`Unter jeder Aussage steht in einer zweiten Zeile die Einschätzung von ${esc(fremd.tlName)} – gleiche Skala, dunkler Punkt = Selbsteinschätzung, brauner Punkt = ${esc(fremd.tlName)}; Abweichungen ab 2 Punkten sind gelb hinterlegt. Die Person selbst sieht diese Werte nicht.`:`${esc(fremd.tlName)} hat die Einschätzung noch nicht abgegeben.`}</div>` : '';
  return `<div class="skala-legende">1 = trifft gar nicht zu · 5 = trifft voll zu · k. A. = keine Angabe</div>${fremdInfo}

}

function tlEinschaetzungFuer(maUpn, runde){
  const i = items.find(x => { const u=(x.f.MitarbeiterUpn||'').toLowerCase(); return u.startsWith(TL_PRAEFIX) && u.endsWith(':'+(maUpn||'').toLowerCase()) && x.f.Runde===runde; });

async function speichern(manuell, extra={}){
  clearTimeout(saveTimer);

  /* Jede Sicht schreibt NUR ihre eigenen Felder — so überschreiben sich Mitarbeiter:in und Leitung nie gegenseitig. */
  const fields = gfSicht ? { LeitungJSON:JSON.stringify(akt.leitung), KennzahlenJSON:akt.kennzahlen?JSON.stringify(akt.kennzahlen):'', ...extra }
                         : { AntwortenJSON:JSON.stringify(akt.antworten), ...extra };
  try{
    if(s) s.textContent='Speichert …';
    await graph(`${LISTE()}/items/${akt.spId}/fields`,{method:'PATCH',body:JSON.stringify(fields)});

  const r=await fetch('https://graph.microsoft.com/v1.0/me/sendMail',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},

  if(!r.ok) throw new Error('HTTP '+r.status);
}

  const runde=aktRunde(), offen=offeneFreigaben(runde), el=document.getElementById('adminMsg');
  if(!offen.length) return;
  if(!confirm('Selbsteinschätzung jetzt an die Teamleitung senden?\n\n'+offen.map(x=>'• '+x.i.f.MitarbeiterName+' → '+x.t.tlName).join('\n')+'\n\nDie Teamleitungen haben ihre eigene Einschätzung bereits abgegeben.')) return;
  let ok=0;
  for(const x of offen){
    const name=(x.i.f.MitarbeiterName||'').split(',').reverse().join(' ').trim();
    try{
      await sendeMail(x.t.tlUpn, `Orientierungsgespräch ${runde} – Selbsteinschätzung ${name}`, bogenAlsHtml(x.e,
        `<p>Hallo ${esc(x.t.tlName.split(' ')[0])},</p><p>du hast deine Einschätzung zu <b>${esc(name)}</b> abgegeben – hier ist nun die Selbsteinschätzung als Vorbereitung auf das Gespräch${x.i.f.Termin?' am '+esc(fmtDT(x.i.f.Termin)):''}. Daneben steht deine eigene Einschätzung zum direkten Vergleich. Bitte behandle sie vertraulich.</p>`, {...x.t, kurz:'Du'}));
      x.e.leitung.freigabeTL=new Date().toISOString();
      await graph(`${LISTE()}/items/${x.i.spId}/fields`,{method:'PATCH',body:JSON.stringify({LeitungJSON:JSON.stringify(x.e.leitung)})});
      x.i.f.LeitungJSON=JSON.stringify(x.e.leitung); ok++;
    }catch(e){ console.warn('Freigabe fehlgeschlagen —',name,e.message); }
  }
  await zeigeAdmin();
  const e2=document.getElementById('adminMsg'); e2.className='msg '+(ok===offen.length?'ok':'err'); e2.textContent=`${ok} von ${offen.length} Selbsteinschätzung(en) an die Teamleitung gesendet.`;
}
/* Vorgang einer Person für die Runde komplett zurücksetzen: Bogen, Einschätzung(en) der Teamleitung/Sonja, Einladungsvermerk.
 * Version und Termin bleiben erhalten. Gelöschte Elemente liegen im SharePoint-Papierkorb (ca. 93 Tage wiederherstellbar). */
function vorgangTeile(u, runde){
  const teile=[];
  const bogen=items.find(x=>(x.f.MitarbeiterUpn||'').toLowerCase()===u && x.f.Runde===runde);
  if(bogen) teile.push({art:'bogen', item:bogen, text:`Bogen (Status „${bogen.f.OGStatus}“)`});
  items.filter(x=>{ const k=(x.f.MitarbeiterUpn||'').toLowerCase(); return k.startsWith(TL_PRAEFIX) && k.endsWith(':'+u) && x.f.Runde===runde; })
    .forEach(x=>{ const t=(x.f.MitarbeiterUpn||'').slice(TL_PRAEFIX.length).split(':')[0]; teile.push({art:'tl', item:x, text:`Einschätzung von ${GF_NAMEN[t]||((mitarbeiter||[]).find(m=>m.upn===t)?.name||t)} (Status „${x.f.OGStatus}“)`}); });
  if(plan[u]?.mailAm) teile.push({art:'mail', text:`Einladungsvermerk (gesendet ${fmtDT(plan[u].mailAm)})`});
  return teile;
}
async function vorgangZuruecksetzen(u){
  const runde=aktRunde(), m=mitarbeiter.find(x=>x.upn===u), teile=vorgangTeile(u,runde), el=document.getElementById('adminMsg');
  if(!teile.length) return;
  const abgegeben=teile.some(t=>t.item && ['Abgegeben','Abgeschlossen'].includes(t.item.f.OGStatus));
  if(!confirm(`Vorgang für ${m.name} (Runde ${runde}) zurücksetzen?\n\nGelöscht wird:\n`+teile.map(t=>'• '+t.text).join('\n')+
    `\n\nVersion und Termin bleiben erhalten. Bereits versendete E-Mails lassen sich nicht zurückholen.`+(abgegeben?'\n\nACHTUNG: Es sind bereits abgegebene Inhalte dabei.':''))) return;
  let fehler=0;
  for(const t of teile.filter(t=>t.item)){
    try{ await graph(`${LISTE()}/items/${t.item.spId}`,{method:'DELETE'}); items=items.filter(i=>i.spId!==t.item.spId); }
    catch(e){ fehler++; console.warn('Löschen fehlgeschlagen —',t.text,e.message); }
  }
  if(plan[u]?.mailAm){ delete plan[u].mailAm; await setPlan(u,'mailAm',undefined); }
  await zeigeAdmin();
  const e2=document.getElementById('adminMsg'); e2.className='msg '+(fehler?'err':'ok');
  e2.textContent = fehler ? `Zurücksetzen nur teilweise gelungen (${fehler} Element(e) konnten nicht gelöscht werden).` : `Vorgang für ${m.name} zurückgesetzt – die Person steht wieder auf „Offen“ und kann neu eingeladen werden.`;
}
async function setzeAus(u,aus){ await setPlan(u,'aus',aus); zeigeAdmin(); }
async function gruppenFreigeben(){ const k=await teamKarte(true); if(k) zeigeAdmin(); else alert('Freigabe nicht erfolgt: '+(gruppenFehler||'unbekannt')); }
async function setPlan(u,k,w){
  (plan[u] ||= {})[k]=w;
  const runde=aktRunde(), body={AntwortenJSON:JSON.stringify(plan)};
  try{
    if(planItem){ await graph(`${LISTE()}/items/${planItem.spId}/fields`,{method:'PATCH',body:JSON.stringify(body)}); planItem.f.AntwortenJSON=body.AntwortenJSON; }   // lokalen Stand mitführen, sonst geht er beim Neuaufbau der Übersicht verloren
    else { const neu=await graph(LISTE()+'/items',{method:'POST',body:JSON.stringify({fields:{Title:'Planung '+runde,MitarbeiterUpn:planKey(runde),Runde:runde,...body}})}); planItem={spId:neu.id,f:{MitarbeiterUpn:planKey(runde),Runde:runde,...body}}; items.push(planItem); }
  }catch(e){ const m=document.getElementById('adminMsg'); m.className='msg err'; m.textContent='Planung konnte nicht gespeichert werden: '+e.message; }
}
async function kopiere(u){
  const m=mitarbeiter.find(x=>x.upn===u); await navigator.clipboard.writeText(linkFuer(m,aktRunde()));
  const el=document.getElementById('adminMsg'); el.className='msg ok'; el.textContent='Link für '+m.name+' kopiert.';
}
/* Einladung als HTML-Mail über Graph (Mail.Send) aus dem Postfach der angemeldeten GF — mit echtem, klickbarem Link.
 * Ein mailto:-Entwurf kann nur reinen Text; Outlook bricht die lange Adresse dann um und sie ist nicht mehr anklickbar. */
function einladungHtml(m, link, termin){
  const vor=(m.name.split(',')[1]||m.name).trim().split(' ')[0];
  return `<div style="font-family:Kodchasan,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.55;color:#211F1B;max-width:640px">
    <p>Hallo ${esc(vor)},</p>
    <p>unser Orientierungsgespräch steht an${termin?' am <b>'+esc(termin)+'</b>':''}. Zur Vorbereitung haben wir einen kurzen Online-Bogen für dich (ca. 10 Minuten):</p>
    <p style="margin:22px 0"><a href="${esc(link)}" style="background:#7B3F1E;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:600;display:inline-block">Zum Vorbereitungsbogen</a></p>
    <p>Du meldest dich mit deinem Praxis-NeueWege-Konto an. Du kannst jederzeit zwischenspeichern und später weitermachen – bitte gib den Bogen <b>spätestens zwei Tage vor dem Gespräch</b> final ab.</p>
    <p>Wer lieber auf Papier schreibt: Im Bogen gibt es unten „Auf Papier ausfüllen“ – dann bitte ebenfalls spätestens zwei Tage vorher bei uns abgeben.</p>
    <p>Den Bogen bekommen wir beide als Vorbereitung auf das Gespräch. Deine Teamleitung gibt zu Teil 1 unabhängig davon eine eigene Einschätzung ab und erhält deinen Bogen erst danach.</p>
    <p>Wie es geht, steht auf einer Seite: <a href="${ANLEITUNG.ma}" style="color:#A15F38;font-weight:600">Kurzanleitung (PDF)</a></p>
    <p>Wir freuen uns auf das Gespräch!<br>Sonja &amp; Markus</p>
    <p style="font-size:12px;color:#8A857B;border-top:1px solid #E4DED2;padding-top:10px;margin-top:24px">Falls der Button nicht funktioniert, nutze diesen Link: <a href="${esc(link)}" style="color:#A15F38">Vorbereitungsbogen öffnen</a></p></div>`;
}
async function mail(u){
  if(!(await versionOk())) return;
  const m=mitarbeiter.find(x=>x.upn===u), p=plan[u]||{}, link=linkFuer(m,aktRunde()), termin=p.t?fmtDT(p.t):'';
  const name=(m.name||'').split(',').reverse().join(' ').trim(), el=document.getElementById('adminMsg');
  if(!confirm(`Einladung jetzt an ${name} (${u}) senden?\n\nSie geht als E-Mail mit klickbarem Link aus deinem Postfach${termin?' – Termin: '+termin:' – es ist noch kein Termin eingetragen'}.`)) return;
  try{
    el.className='msg warn'; el.textContent='Einladung wird gesendet …';
    const req={scopes:['Mail.Send'],account:currentAccount};
    const tok=(await msalInstance.acquireTokenSilent(req).catch(()=>msalInstance.acquireTokenPopup(req))).accessToken;
    const r=await fetch('https://graph.microsoft.com/v1.0/me/sendMail',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({message:{subject:'Dein Orientierungsgespräch – Vorbereitungsbogen',body:{contentType:'HTML',content:einladungHtml(m,link,termin)},
        toRecipients:[{emailAddress:{address:u}}]},saveToSentItems:true})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    await setPlan(u,'mailAm',new Date().toISOString());
    await zeigeAdmin();
    const e2=document.getElementById('adminMsg'); e2.className='msg ok'; e2.textContent='Einladung an '+name+' gesendet (liegt in deinen „Gesendeten Elementen“).';
  }catch(e){ el.className='msg err'; el.textContent='Einladung konnte nicht gesendet werden: '+e.message+' – du kannst den Link stattdessen kopieren.'; }
}

/* ═══════════════════════════════════════════════════════════
 * EINRICHTUNG (nur GF, einmalig)
 * ═══════════════════════════════════════════════════════════ */
function zeigeSetup(){
  app().innerHTML=`<div class="card"><h2 class="teil" style="margin-top:0">Einrichtung der zentralen Ablage</h2>
    <p style="margin:8px 0 14px">Die SharePoint-Liste <b>${esc(CFG.listName)}</b> existiert noch nicht. Sie wird jetzt mit allen Spalten und einem Prüf-Element angelegt.</p>
    <button class="btn btn-primary" onclick="setup()">Liste anlegen</button><div class="msg" id="setupMsg"></div></div>`;
}
async function setup(){
  const m=document.getElementById('setupMsg');
  try{
    m.className='msg warn'; m.textContent='Berechtigung anfordern …';
    const req={scopes:['Sites.Manage.All'],account:currentAccount};
    const t=(await msalInstance.acquireTokenSilent(req).catch(()=>msalInstance.acquireTokenPopup(req))).accessToken;
    m.textContent='Liste wird angelegt …';
    const r=await fetch(`https://graph.microsoft.com/v1.0/sites/${CFG.spHost}/lists`,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},
      body:JSON.stringify({displayName:CFG.listName,columns:SPALTEN,list:{template:'genericList'}})});
    if(!r.ok) throw new Error(r.status+': '+(await r.text()).slice(0,300));
    await graph(LISTE()+'/items',{method:'POST',body:JSON.stringify({fields:{Title:'Sicherheitsprüfung – nicht löschen',MitarbeiterUpn:SENTINEL,OGStatus:'System'}})});
    m.className='msg ok';
    m.innerHTML=`<b>Liste angelegt.</b> Jetzt bitte <u>einmalig in SharePoint</u> absichern – ohne diese Schritte sperrt die App das Ausfüllen:<br><br>
      1. Liste öffnen → ⚙ → Listeneinstellungen → <b>Erweiterte Einstellungen</b> → „Berechtigungen auf Elementebene“: Lesezugriff <b>„Elemente, die vom Benutzer erstellt wurden“</b>, Erstell-/Bearbeitungszugriff <b>„Eigene Elemente erstellen und bearbeiten“</b>.<br>
      2. Listeneinstellungen → <b>Berechtigungen für diese Liste</b> → Vererbung beenden → Mitglieder und Besucher auf <b>„Mitwirken“</b> setzen (nicht „Bearbeiten“ – das enthält „Listen verwalten“ und hebelt Schritt 1 aus). Vollzugriff nur Sonja und Markus.<br>
      3. Mit einem Test-Mitarbeiterkonto einen Link öffnen: Erscheint der Bogen, ist alles richtig. Erscheint „Sicherheitsprüfung fehlgeschlagen“, stimmt Schritt 1 oder 2 noch nicht.<br><br>
      <button class="btn btn-primary btn-sm" onclick="location.reload()">Zur Übersicht</button>`;
  }catch(e){ m.className='msg err'; m.textContent='Einrichtung fehlgeschlagen: '+e.message; }
}
